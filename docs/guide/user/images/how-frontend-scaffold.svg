<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 616" width="920" height="616" role="img" aria-labelledby="t d">
<title id="t">How the frontend-scaffold plugin works</title>
<desc id="d">You: Describe the app, Run it, Ask for a check. Skill: Clarify, Generate, Install and build. Agent: frontend-validator. On disk: The project folder. Note: Order matters: configuration first, then bootstrap, UI components, the API layer, stores, router and views.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.soft{fill:var(--soft)}.dot{fill:var(--accent)}.ring{fill:var(--bg);stroke:var(--faint);stroke-width:1.2}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}a{cursor:pointer}a:hover .card,a:focus .card{stroke:var(--accent)}a:hover .arrow,a:focus .arrow{stroke:var(--accent)}a:hover .name,a:focus .name{fill:var(--accent)}a:focus{outline:none}</style>
<rect class="panel" x=".5" y=".5" width="919" height="615" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">frontend-scaffold</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">HOW IT WORKS</tspan><tspan dx="10">1 skill · 1 agent</tspan></text>
<rect class="card" x="32" y="80" width="856" height="102" rx="10"/>
<text x="46" y="134.5" class="faint caps" font-size="9.5">YOU</text>
<rect class="card" x="32" y="198" width="856" height="102" rx="10"/>
<text x="46" y="252.5" class="faint caps" font-size="9.5">SKILL</text>
<rect class="card" x="32" y="316" width="856" height="102" rx="10"/>
<text x="46" y="370.5" class="faint caps" font-size="9.5">AGENT</text>
<rect class="card" x="32" y="434" width="856" height="102" rx="10"/>
<text x="46" y="482" class="faint caps" font-size="9.5">ON</text>
<text x="46" y="495" class="faint caps" font-size="9.5">DISK</text>
<rect class="tile" x="135" y="88" width="169" height="86" rx="8"/>
<text x="147" y="108" class="fg b" font-size="12.5">Describe the app</text>
<text x="147" y="124" class="muted" font-size="11">One line: what it manages</text>
<text x="147" y="137.5" class="muted" font-size="11">and the states it goes</text>
<text x="147" y="151" class="muted" font-size="11">through.</text>
<rect class="tile" x="517" y="88" width="169" height="86" rx="8"/>
<text x="529" y="108" class="fg b" font-size="12.5">Run it</text>
<text x="529" y="123" class="faint mono" font-size="10">npm run dev</text>
<text x="529" y="138" class="muted" font-size="11">Then point it at your own</text>
<text x="529" y="151.5" class="muted" font-size="11">REST API.</text>
<rect class="tile" x="708" y="88" width="169" height="86" rx="8"/>
<text x="720" y="108" class="fg b" font-size="12.5">Ask for a check</text>
<text x="720" y="124" class="muted" font-size="11">Later, for example after you</text>
<text x="720" y="137.5" class="muted" font-size="11">changed the project.</text>
<rect class="tile" x="135" y="206" width="169" height="86" rx="8"/>
<text x="147" y="226" class="fg b" font-size="12.5">Clarify</text>
<text x="147" y="242" class="muted" font-size="11">Name, main object, fields,</text>
<text x="147" y="255.5" class="muted" font-size="11">statuses, API path, target</text>
<text x="147" y="269" class="muted" font-size="11">folder.</text>
<circle class="dot" cx="136" cy="207" r="9"/>
<text x="136" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">1</text>
<rect class="tile" x="326" y="206" width="169" height="86" rx="8"/>
<text x="338" y="226" class="fg b" font-size="12.5">Generate</text>
<text x="338" y="241" class="faint mono" font-size="10">8 pattern references</text>
<text x="338" y="256" class="muted" font-size="11">Config, bootstrap, UI, API,</text>
<text x="338" y="269.5" class="muted" font-size="11">stores, router, views.</text>
<circle class="dot" cx="327" cy="207" r="9"/>
<text x="327" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">2</text>
<rect class="tile" x="517" y="206" width="169" height="86" rx="8"/>
<text x="529" y="226" class="fg b" font-size="12.5">Install and build</text>
<text x="529" y="241" class="faint mono" font-size="10">npm install · run build</text>
<text x="529" y="256" class="muted" font-size="11">Fixes type errors before it</text>
<text x="529" y="269.5" class="muted" font-size="11">reports.</text>
<circle class="dot" cx="518" cy="207" r="9"/>
<text x="518" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">3</text>
<rect class="tile" x="708" y="324" width="169" height="86" rx="8"/>
<text x="720" y="344" class="fg b mono" font-size="11.5">frontend-validator</text>
<text x="720" y="359" class="faint mono" font-size="10">agent · sonnet</text>
<text x="720" y="374" class="muted" font-size="11">Structure, patterns, types,</text>
<text x="720" y="387.5" class="muted" font-size="11">security, accessibility.</text>
<circle class="dot" cx="709" cy="325" r="9"/>
<text x="709" y="329" class="onaccent b" font-size="10.5" text-anchor="middle">4</text>
<rect class="tile" x="326" y="442" width="551" height="86" rx="8"/>
<text x="338" y="462" class="fg b" font-size="12.5">The project folder</text>
<text x="338" y="478" class="muted" font-size="11">A login page, a list with filters, a multi-step create form and a detail page, plus the buttons,</text>
<text x="338" y="491.5" class="muted" font-size="11">tables and dialogs they are built from.</text>
<path class="arrow" d="M219.5 177V202m-5 -5l5 5 5-5"/>
<path class="arrow" d="M307 249H322m-5 -5l5 5-5 5"/>
<path class="arrow" d="M498 249H513m-5 -5l5 5-5 5"/>
<path class="arrow" d="M410.5 295V438m-5 -5l5 5 5-5"/>
<path class="arrow" d="M601.5 203V178m-5 5l5-5 5 5"/>
<path class="arrow" d="M792.5 177V320m-5 -5l5 5 5-5" stroke-dasharray="4 4"/>
<path class="arrow" d="M792.5 413V438m-5 -5l5 5 5-5"/>
<rect class="panel" stroke="none" style="stroke:none" x="413.5" y="301" width="41.8" height="14" rx="3"/>
<text x="418.5" y="311.5" class="muted" font-size="10" text-anchor="start">writes</text>
<rect class="panel" stroke="none" style="stroke:none" x="604.5" y="183.5" width="47.1" height="14" rx="3"/>
<text x="609.5" y="194" class="muted" font-size="10" text-anchor="start">reports</text>
<rect class="panel" stroke="none" style="stroke:none" x="795.5" y="183" width="63" height="14" rx="3"/>
<text x="800.5" y="193.5" class="muted" font-size="10" text-anchor="start">on request</text>
<rect class="panel" stroke="none" style="stroke:none" x="795.5" y="418.5" width="78.9" height="14" rx="3"/>
<text x="800.5" y="429" class="muted" font-size="10" text-anchor="start">reads, builds</text>
<rect class="soft" x="32" y="552" width="856" height="38" rx="8"/>
<text x="48" y="576" class="accent caps" font-size="10.5">NOTE</text>
<text x="95.6" y="576" class="fg" font-size="12.5">Order matters: configuration first, then bootstrap, UI components, the API layer, stores, router and views.</text>
</svg>
