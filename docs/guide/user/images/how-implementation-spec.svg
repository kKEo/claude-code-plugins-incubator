<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 616" width="920" height="616" role="img" aria-labelledby="t d">
<title id="t">How the implementation-spec plugin works</title>
<desc id="d">You: Ask, Answer. Skill: Resolve the spec path, Interview, Write the spec, Report. Agents: spec-context-explorer, spec-readiness-reviewer. On disk: The spec. Note: Security decisions with no precedent become HALT items: the only point where the building agent may stop and ask.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.soft{fill:var(--soft)}.dot{fill:var(--accent)}.ring{fill:var(--bg);stroke:var(--faint);stroke-width:1.2}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}a{cursor:pointer}a:hover .card,a:focus .card{stroke:var(--accent)}a:hover .arrow,a:focus .arrow{stroke:var(--accent)}a:hover .name,a:focus .name{fill:var(--accent)}a:focus{outline:none}</style>
<rect class="panel" x=".5" y=".5" width="919" height="615" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">implementation-spec</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">HOW IT WORKS</tspan><tspan dx="10">1 skill · 2 agents</tspan></text>
<rect class="card" x="32" y="80" width="856" height="102" rx="10"/>
<text x="46" y="134.5" class="faint caps" font-size="9.5">YOU</text>
<rect class="card" x="32" y="198" width="856" height="102" rx="10"/>
<text x="46" y="252.5" class="faint caps" font-size="9.5">SKILL</text>
<rect class="card" x="32" y="316" width="856" height="102" rx="10"/>
<text x="46" y="370.5" class="faint caps" font-size="9.5">AGENTS</text>
<rect class="card" x="32" y="434" width="856" height="102" rx="10"/>
<text x="46" y="482" class="faint caps" font-size="9.5">ON</text>
<text x="46" y="495" class="faint caps" font-size="9.5">DISK</text>
<rect class="tile" x="135" y="88" width="169" height="86" rx="8"/>
<text x="147" y="108" class="fg b" font-size="12.5">Ask</text>
<text x="147" y="124" class="muted" font-size="11">“Write a spec for CSV export</text>
<text x="147" y="137.5" class="muted" font-size="11">of invoice history.”</text>
<rect class="tile" x="326" y="88" width="169" height="86" rx="8"/>
<text x="338" y="108" class="fg b" font-size="12.5">Answer</text>
<text x="338" y="124" class="muted" font-size="11">Only what Claude cannot work</text>
<text x="338" y="137.5" class="muted" font-size="11">out from the repository.</text>
<rect class="tile" x="135" y="206" width="169" height="86" rx="8"/>
<text x="147" y="226" class="fg b" font-size="12.5">Resolve the spec path</text>
<text x="147" y="242" class="muted" font-size="11">A second run for the same</text>
<text x="147" y="255.5" class="muted" font-size="11">feature updates the same</text>
<text x="147" y="269" class="muted" font-size="11">file.</text>
<circle class="dot" cx="136" cy="207" r="9"/>
<text x="136" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">1</text>
<rect class="tile" x="326" y="206" width="169" height="86" rx="8"/>
<text x="338" y="226" class="fg b" font-size="12.5">Interview</text>
<text x="338" y="242" class="muted" font-size="11">At most four questions,</text>
<text x="338" y="255.5" class="muted" font-size="11">asked in one batch.</text>
<circle class="dot" cx="327" cy="207" r="9"/>
<text x="327" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">3</text>
<rect class="tile" x="517" y="206" width="169" height="86" rx="8"/>
<text x="529" y="226" class="fg b" font-size="12.5">Write the spec</text>
<text x="529" y="242" class="muted" font-size="11">Requirements, contracts,</text>
<text x="529" y="255.5" class="muted" font-size="11">ordered steps, tests,</text>
<text x="529" y="269" class="muted" font-size="11">security.</text>
<circle class="dot" cx="518" cy="207" r="9"/>
<text x="518" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">4</text>
<rect class="tile" x="708" y="206" width="169" height="86" rx="8"/>
<text x="720" y="226" class="fg b" font-size="12.5">Report</text>
<text x="720" y="242" class="muted" font-size="11">Counts, decisions made for</text>
<text x="720" y="255.5" class="muted" font-size="11">you, what needs your</text>
<text x="720" y="269" class="muted" font-size="11">sign-off.</text>
<circle class="dot" cx="709" cy="207" r="9"/>
<text x="709" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">6</text>
<rect class="tile" x="135" y="324" width="169" height="86" rx="8"/>
<text x="147" y="344" class="fg b mono" font-size="10.5">spec-context-explorer</text>
<text x="147" y="359" class="faint mono" font-size="10">sonnet · writes nothing</text>
<text x="147" y="374" class="muted" font-size="11">Stack, commands, closest</text>
<text x="147" y="387.5" class="muted" font-size="11">precedent, reusable code.</text>
<circle class="dot" cx="136" cy="325" r="9"/>
<text x="136" y="329" class="onaccent b" font-size="10.5" text-anchor="middle">2</text>
<rect class="tile" x="708" y="324" width="169" height="86" rx="8"/>
<text x="720" y="344" class="fg b mono" font-size="10">spec-readiness-reviewer</text>
<text x="720" y="359" class="faint mono" font-size="10">sonnet · writes nothing</text>
<text x="720" y="374" class="muted" font-size="11">READY or NOT READY. Runs at</text>
<text x="720" y="387.5" class="muted" font-size="11">most twice.</text>
<circle class="dot" cx="709" cy="325" r="9"/>
<text x="709" y="329" class="onaccent b" font-size="10.5" text-anchor="middle">5</text>
<rect class="tile" x="517" y="442" width="360" height="86" rx="8"/>
<text x="529" y="462" class="fg b" font-size="12.5">The spec</text>
<text x="529" y="477" class="faint mono" font-size="10">docs/specs/&lt;date&gt;-&lt;slug&gt;.md</text>
<text x="529" y="492" class="muted" font-size="11">One flat file per feature, complete enough to hand to an agent</text>
<text x="529" y="505.5" class="muted" font-size="11">that builds it.</text>
<path class="arrow" d="M219.5 177V202m-5 -5l5 5 5-5"/>
<path class="arrow" d="M219.5 295V320m-5 -5l5 5 5-5"/>
<path class="arrow" d="M259.5 321V308H410.5V296m-5 5l5-5 5 5"/>
<path class="arrow" d="M410.5 203V178m-5 5l5-5 5 5"/>
<path class="arrow" d="M498 249H513m-5 -5l5 5-5 5"/>
<path class="arrow" d="M601.5 295V438m-5 -5l5 5 5-5"/>
<path class="arrow" d="M651.5 295V308H752.5V320m-5 -5l5 5 5-5"/>
<path class="arrow" d="M822.5 321V296m-5 5l5-5 5 5"/>
<rect class="panel" stroke="none" style="stroke:none" x="295.6" y="301" width="78.9" height="14" rx="3"/>
<text x="335" y="311.5" class="muted" font-size="10" text-anchor="middle">what it found</text>
<rect class="panel" stroke="none" style="stroke:none" x="413.5" y="183.5" width="31.2" height="14" rx="3"/>
<text x="418.5" y="194" class="muted" font-size="10" text-anchor="start">asks</text>
<rect class="panel" stroke="none" style="stroke:none" x="604.5" y="301" width="41.8" height="14" rx="3"/>
<text x="609.5" y="311.5" class="muted" font-size="10" text-anchor="start">writes</text>
<rect class="panel" stroke="none" style="stroke:none" x="681.1" y="301" width="41.8" height="14" rx="3"/>
<text x="702" y="311.5" class="muted" font-size="10" text-anchor="middle">audits</text>
<rect class="panel" stroke="none" style="stroke:none" x="825.5" y="301.5" width="47.1" height="14" rx="3"/>
<text x="830.5" y="312" class="muted" font-size="10" text-anchor="start">verdict</text>
<rect class="soft" x="32" y="552" width="856" height="38" rx="8"/>
<text x="48" y="576" class="accent caps" font-size="10.5">NOTE</text>
<text x="95.6" y="576" class="fg" font-size="12.5">Security decisions with no precedent become HALT items: the only point where the building agent may stop and ask.</text>
</svg>
