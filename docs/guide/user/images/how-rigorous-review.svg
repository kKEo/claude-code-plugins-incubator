<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 498" width="920" height="498" role="img" aria-labelledby="t d">
<title id="t">How the rigorous-review plugin works</title>
<desc id="d">You: Ask, Narrow it, Read the review. Skill: Resolve the target, Read the diff, Check five areas, Report findings. Your code: The change, The surrounding code. Note: A focused review reports only findings in that area, except a critical issue noticed outside it.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.soft{fill:var(--soft)}.dot{fill:var(--accent)}.ring{fill:var(--bg);stroke:var(--faint);stroke-width:1.2}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}a{cursor:pointer}a:hover .card,a:focus .card{stroke:var(--accent)}a:hover .arrow,a:focus .arrow{stroke:var(--accent)}a:hover .name,a:focus .name{fill:var(--accent)}a:focus{outline:none}</style>
<rect class="panel" x=".5" y=".5" width="919" height="497" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">rigorous-review</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">HOW IT WORKS</tspan><tspan dx="10">1 skill</tspan></text>
<rect class="card" x="32" y="80" width="856" height="102" rx="10"/>
<text x="46" y="134.5" class="faint caps" font-size="9.5">YOU</text>
<rect class="card" x="32" y="198" width="856" height="102" rx="10"/>
<text x="46" y="252.5" class="faint caps" font-size="9.5">SKILL</text>
<rect class="card" x="32" y="316" width="856" height="102" rx="10"/>
<text x="46" y="364" class="faint caps" font-size="9.5">YOUR</text>
<text x="46" y="377" class="faint caps" font-size="9.5">CODE</text>
<rect class="tile" x="135" y="88" width="169" height="86" rx="8"/>
<text x="147" y="108" class="fg b" font-size="12.5">Ask</text>
<text x="147" y="123" class="faint mono" font-size="10">/rigorous-review 123</text>
<text x="147" y="138" class="muted" font-size="11">Or say “do a rigorous</text>
<text x="147" y="151.5" class="muted" font-size="11">review”.</text>
<rect class="tile" x="517" y="88" width="169" height="86" rx="8"/>
<text x="529" y="108" class="fg b" font-size="12.5">Narrow it</text>
<text x="529" y="123" class="faint mono" font-size="10">--focus security</text>
<text x="529" y="138" class="muted" font-size="11">Optional. Any area name</text>
<text x="529" y="151.5" class="muted" font-size="11">works.</text>
<rect class="tile" x="708" y="88" width="169" height="86" rx="8"/>
<text x="720" y="108" class="fg b" font-size="12.5">Read the review</text>
<text x="720" y="124" class="muted" font-size="11">“No critical issues found.”</text>
<text x="720" y="137.5" class="muted" font-size="11">when the change is clean.</text>
<rect class="tile" x="135" y="206" width="169" height="86" rx="8"/>
<text x="147" y="226" class="fg b" font-size="12.5">Resolve the target</text>
<text x="147" y="242" class="muted" font-size="11">A PR number, a branch, a</text>
<text x="147" y="255.5" class="muted" font-size="11">path, or the current change.</text>
<circle class="dot" cx="136" cy="207" r="9"/>
<text x="136" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">1</text>
<rect class="tile" x="326" y="206" width="169" height="86" rx="8"/>
<text x="338" y="226" class="fg b" font-size="12.5">Read the diff</text>
<text x="338" y="242" class="muted" font-size="11">Against the default branch,</text>
<text x="338" y="255.5" class="muted" font-size="11">with the code around each</text>
<text x="338" y="269" class="muted" font-size="11">hunk.</text>
<circle class="dot" cx="327" cy="207" r="9"/>
<text x="327" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">2</text>
<rect class="tile" x="517" y="206" width="169" height="86" rx="8"/>
<text x="529" y="226" class="fg b" font-size="12.5">Check five areas</text>
<text x="529" y="242" class="muted" font-size="11">Logic, concurrency,</text>
<text x="529" y="255.5" class="muted" font-size="11">security, performance,</text>
<text x="529" y="269" class="muted" font-size="11">architecture.</text>
<circle class="dot" cx="518" cy="207" r="9"/>
<text x="518" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">3</text>
<rect class="tile" x="708" y="206" width="169" height="86" rx="8"/>
<text x="720" y="226" class="fg b" font-size="12.5">Report findings</text>
<text x="720" y="242" class="muted" font-size="11">Severity, file:line, why it</text>
<text x="720" y="255.5" class="muted" font-size="11">breaks, a minimal fix.</text>
<circle class="dot" cx="709" cy="207" r="9"/>
<text x="709" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">4</text>
<rect class="tile" x="135" y="324" width="360" height="86" rx="8"/>
<text x="147" y="344" class="fg b" font-size="12.5">The change</text>
<text x="147" y="359" class="faint mono" font-size="10">git · gh for a PR</text>
<text x="147" y="374" class="muted" font-size="11">The diff of the PR, branch, path or uncommitted work.</text>
<rect class="tile" x="517" y="324" width="360" height="86" rx="8"/>
<text x="529" y="344" class="fg b" font-size="12.5">The surrounding code</text>
<text x="529" y="360" class="muted" font-size="11">Read to judge each hunk in context. The skill never edits a file.</text>
<path class="arrow" d="M219.5 177V202m-5 -5l5 5 5-5"/>
<path class="arrow" d="M307 249H322m-5 -5l5 5-5 5"/>
<path class="arrow" d="M498 249H513m-5 -5l5 5-5 5"/>
<path class="arrow" d="M689 249H704m-5 -5l5 5-5 5"/>
<path class="arrow" d="M792.5 203V178m-5 5l5-5 5 5"/>
<path class="arrow" d="M601.5 177V202m-5 -5l5 5 5-5" stroke-dasharray="4 4"/>
<path class="arrow" d="M410.5 295V320m-5 -5l5 5 5-5"/>
<path class="arrow" d="M601.5 295V320m-5 -5l5 5 5-5"/>
<rect class="panel" stroke="none" style="stroke:none" x="604.5" y="182.5" width="36.5" height="14" rx="3"/>
<text x="609.5" y="193" class="muted" font-size="10" text-anchor="start">focus</text>
<rect class="panel" stroke="none" style="stroke:none" x="413.5" y="300.5" width="36.5" height="14" rx="3"/>
<text x="418.5" y="311" class="muted" font-size="10" text-anchor="start">reads</text>
<rect class="panel" stroke="none" style="stroke:none" x="604.5" y="300.5" width="36.5" height="14" rx="3"/>
<text x="609.5" y="311" class="muted" font-size="10" text-anchor="start">reads</text>
<rect class="soft" x="32" y="434" width="856" height="38" rx="8"/>
<text x="48" y="458" class="accent caps" font-size="10.5">NOTE</text>
<text x="95.6" y="458" class="fg" font-size="12.5">A focused review reports only findings in that area, except a critical issue noticed outside it.</text>
</svg>
