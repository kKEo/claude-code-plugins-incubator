<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 616" width="920" height="616" role="img" aria-labelledby="t d">
<title id="t">How the gitbook-docs-validator plugin works</title>
<desc id="d">You: Ask, Read the verdict. Skill: Find the docs root, Run the script, Read a sample, Write the report. Script: Deterministic checks. On disk: Your documentation, The repository. Note: The script exits with 1 on any error, so the same checks can gate a pull request in CI.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.soft{fill:var(--soft)}.dot{fill:var(--accent)}.ring{fill:var(--bg);stroke:var(--faint);stroke-width:1.2}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}a{cursor:pointer}a:hover .card,a:focus .card{stroke:var(--accent)}a:hover .arrow,a:focus .arrow{stroke:var(--accent)}a:hover .name,a:focus .name{fill:var(--accent)}a:focus{outline:none}</style>
<rect class="panel" x=".5" y=".5" width="919" height="615" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">gitbook-docs-validator</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">HOW IT WORKS</tspan><tspan dx="10">1 skill · 1 script</tspan></text>
<rect class="card" x="32" y="80" width="856" height="102" rx="10"/>
<text x="46" y="134.5" class="faint caps" font-size="9.5">YOU</text>
<rect class="card" x="32" y="198" width="856" height="102" rx="10"/>
<text x="46" y="252.5" class="faint caps" font-size="9.5">SKILL</text>
<rect class="card" x="32" y="316" width="856" height="102" rx="10"/>
<text x="46" y="370.5" class="faint caps" font-size="9.5">SCRIPT</text>
<rect class="card" x="32" y="434" width="856" height="102" rx="10"/>
<text x="46" y="482" class="faint caps" font-size="9.5">ON</text>
<text x="46" y="495" class="faint caps" font-size="9.5">DISK</text>
<rect class="tile" x="135" y="88" width="169" height="86" rx="8"/>
<text x="147" y="108" class="fg b" font-size="12.5">Ask</text>
<text x="147" y="124" class="muted" font-size="11">“Does our documentation</text>
<text x="147" y="137.5" class="muted" font-size="11">follow the template?”</text>
<rect class="tile" x="708" y="88" width="169" height="86" rx="8"/>
<text x="720" y="108" class="fg b" font-size="12.5">Read the verdict</text>
<text x="720" y="124" class="muted" font-size="11">Nothing changes unless you</text>
<text x="720" y="137.5" class="muted" font-size="11">ask for the findings to be</text>
<text x="720" y="151" class="muted" font-size="11">fixed.</text>
<rect class="tile" x="135" y="206" width="169" height="86" rx="8"/>
<text x="147" y="226" class="fg b" font-size="12.5">Find the docs root</text>
<text x="147" y="242" class="muted" font-size="11">The folder with the landing</text>
<text x="147" y="255.5" class="muted" font-size="11">page and the book folders.</text>
<circle class="dot" cx="136" cy="207" r="9"/>
<text x="136" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">1</text>
<rect class="tile" x="326" y="206" width="169" height="86" rx="8"/>
<text x="338" y="226" class="fg b" font-size="12.5">Run the script</text>
<text x="338" y="241" class="faint mono" font-size="10">validate_docs.py</text>
<text x="338" y="256" class="muted" font-size="11">Mechanical checks come</text>
<text x="338" y="269.5" class="muted" font-size="11">first.</text>
<circle class="dot" cx="327" cy="207" r="9"/>
<text x="327" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">2</text>
<rect class="tile" x="517" y="206" width="169" height="86" rx="8"/>
<text x="529" y="226" class="fg b" font-size="12.5">Read a sample</text>
<text x="529" y="242" class="muted" font-size="11">Judges what a script cannot</text>
<text x="529" y="255.5" class="muted" font-size="11">measure.</text>
<circle class="dot" cx="518" cy="207" r="9"/>
<text x="518" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">4</text>
<rect class="tile" x="708" y="206" width="169" height="86" rx="8"/>
<text x="720" y="226" class="fg b" font-size="12.5">Write the report</text>
<text x="720" y="242" class="muted" font-size="11">Verdict, failures,</text>
<text x="720" y="255.5" class="muted" font-size="11">deviations, suggestions, not</text>
<text x="720" y="269" class="muted" font-size="11">checked.</text>
<circle class="dot" cx="709" cy="207" r="9"/>
<text x="709" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">5</text>
<rect class="tile" x="326" y="324" width="360" height="86" rx="8"/>
<text x="338" y="344" class="fg b" font-size="12.5">Deterministic checks</text>
<text x="338" y="359" class="faint mono" font-size="10">Python 3 · standard library only</text>
<text x="338" y="374" class="muted" font-size="11">landing · book files · summary · pages · links · images · readme</text>
<text x="338" y="387.5" class="muted" font-size="11">· roles · repo</text>
<circle class="dot" cx="327" cy="325" r="9"/>
<text x="327" y="329" class="onaccent b" font-size="10.5" text-anchor="middle">3</text>
<rect class="tile" x="135" y="442" width="551" height="86" rx="8"/>
<text x="147" y="462" class="fg b" font-size="12.5">Your documentation</text>
<text x="147" y="477" class="faint mono" font-size="10">docs/guide/</text>
<text x="147" y="492" class="muted" font-size="11">A landing page and three books, each with SUMMARY.md, book.toml, .gitbook.yaml and its pages.</text>
<rect class="tile" x="708" y="442" width="169" height="86" rx="8"/>
<text x="720" y="462" class="fg b" font-size="12.5">The repository</text>
<text x="720" y="477" class="faint mono" font-size="10">--repo-root</text>
<text x="720" y="492" class="muted" font-size="11">README, docs index, CI</text>
<text x="720" y="505.5" class="muted" font-size="11">workflow, and a Makefile</text>
<text x="720" y="519" class="muted" font-size="11">with docs-site.</text>
<path class="arrow" d="M219.5 177V202m-5 -5l5 5 5-5"/>
<path class="arrow" d="M307 249H322m-5 -5l5 5-5 5"/>
<path class="arrow" d="M436 295V320m-5 -5l5 5 5-5"/>
<path class="arrow" d="M576 321V296m-5 5l5-5 5 5"/>
<path class="arrow" d="M689 249H704m-5 -5l5 5-5 5"/>
<path class="arrow" d="M792.5 203V178m-5 5l5-5 5 5"/>
<path class="arrow" d="M506 413V438m-5 -5l5 5 5-5"/>
<path class="arrow" d="M636 413V426H792.5V438m-5 -5l5 5 5-5"/>
<rect class="panel" stroke="none" style="stroke:none" x="439" y="300.5" width="31.2" height="14" rx="3"/>
<text x="444" y="311" class="muted" font-size="10" text-anchor="start">runs</text>
<rect class="panel" stroke="none" style="stroke:none" x="579" y="301.5" width="131.9" height="14" rx="3"/>
<text x="584" y="312" class="muted" font-size="10" text-anchor="start">findings with file:line</text>
<rect class="panel" stroke="none" style="stroke:none" x="509" y="418.5" width="36.5" height="14" rx="3"/>
<text x="514" y="429" class="muted" font-size="10" text-anchor="start">reads</text>
<rect class="panel" stroke="none" style="stroke:none" x="696" y="419" width="36.5" height="14" rx="3"/>
<text x="714.2" y="429.5" class="muted" font-size="10" text-anchor="middle">reads</text>
<rect class="soft" x="32" y="552" width="856" height="38" rx="8"/>
<text x="48" y="576" class="accent caps" font-size="10.5">NOTE</text>
<text x="95.6" y="576" class="fg" font-size="12.5">The script exits with 1 on any error, so the same checks can gate a pull request in CI.</text>
</svg>
