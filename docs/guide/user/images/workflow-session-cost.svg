<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 294" width="920" height="294" role="img" aria-labelledby="t d">
<title id="t">Workflow of the session-cost plugin</title>
<desc id="d">1. A request ends (claude); 2. Record it (mod); 3. Cost it (mod); 4. Add it up (mod). Result: A pane with Requests, Models, History, Days and Version views, and “$0.544 · 3 req · 130k tok” under the prompt.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.soft{fill:var(--soft)}.dot{fill:var(--accent)}.ring{fill:var(--bg);stroke:var(--faint);stroke-width:1.2}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}a{cursor:pointer}a:hover .card,a:focus .card{stroke:var(--accent)}a:hover .arrow,a:focus .arrow{stroke:var(--accent)}a:hover .name,a:focus .name{fill:var(--accent)}a:focus{outline:none}</style>
<rect class="panel" x=".5" y=".5" width="919" height="293" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26) scale(1.0)"><rect class="ic" x="2.5" y="4" width="19" height="16" rx="2.5"/><path class="ic" d="M14 4v16M16.5 9h2.5M16.5 12.5h2.5M5.5 9h5M5.5 12.5h3.5"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">session-cost</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">WORKFLOW</tspan><tspan dx="10">mod · pane, status line, chip</tspan></text>
<rect class="card" x="32.0" y="76" width="194.5" height="138" rx="10"/>
<circle class="ring" cx="59.0" cy="103" r="11"/>
<text x="59.0" y="107" class="muted b" font-size="11.5" text-anchor="middle">1</text>
<text x="78.0" y="107" class="muted caps" font-size="10.5">CLAUDE</text>
<text x="48.0" y="135" class="fg b" font-size="14">A request ends</text>
<text x="48.0" y="153" class="muted" font-size="12">Main conversation,</text>
<text x="48.0" y="169" class="muted" font-size="12">subagent or compaction.</text>
<path class="arrow" d="M231.5 145.0h16m-5 -5l5 5-5 5"/>
<rect class="card" x="252.5" y="76" width="194.5" height="138" rx="10"/>
<circle class="dot" cx="279.5" cy="103" r="11"/>
<text x="279.5" y="107" class="onaccent b" font-size="11.5" text-anchor="middle">2</text>
<text x="298.5" y="107" class="accent caps" font-size="10.5">MOD</text>
<text x="268.5" y="135" class="fg b" font-size="14">Record it</text>
<text x="268.5" y="153" class="muted" font-size="12">Model, duration and the</text>
<text x="268.5" y="169" class="muted" font-size="12">four token counts.</text>
<path class="arrow" d="M452.0 145.0h16m-5 -5l5 5-5 5"/>
<rect class="card" x="473.0" y="76" width="194.5" height="138" rx="10"/>
<circle class="dot" cx="500.0" cy="103" r="11"/>
<text x="500.0" y="107" class="onaccent b" font-size="11.5" text-anchor="middle">3</text>
<text x="519.0" y="107" class="accent caps" font-size="10.5">MOD</text>
<text x="489.0" y="135" class="fg b" font-size="14">Cost it</text>
<text x="489.0" y="153" class="muted" font-size="12">Its share of the /cost total</text>
<text x="489.0" y="169" class="muted" font-size="12">and a list-price estimate.</text>
<path class="arrow" d="M672.5 145.0h16m-5 -5l5 5-5 5"/>
<rect class="card" x="693.5" y="76" width="194.5" height="138" rx="10"/>
<circle class="dot" cx="720.5" cy="103" r="11"/>
<text x="720.5" y="107" class="onaccent b" font-size="11.5" text-anchor="middle">4</text>
<text x="739.5" y="107" class="accent caps" font-size="10.5">MOD</text>
<text x="709.5" y="135" class="fg b" font-size="14">Add it up</text>
<text x="709.5" y="153" class="muted" font-size="12">By model, by calendar day</text>
<text x="709.5" y="169" class="muted" font-size="12">and across sessions.</text>
<rect class="soft" x="32" y="230" width="856" height="38" rx="8"/>
<text x="48" y="254" class="accent caps" font-size="10.5">RESULT</text>
<text x="110" y="254" class="fg" font-size="12.5">A pane with Requests, Models, History, Days and Version views, and “$0.544 · 3 req · 130k tok” under the prompt.</text>
</svg>
