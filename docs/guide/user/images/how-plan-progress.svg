<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 616" width="920" height="616" role="img" aria-labelledby="t d">
<title id="t">How the plan-progress plugin works</title>
<desc id="d">You: Plan in plan mode. Claude: Writes the plan, Works through it, Marks steps. The mod: Picks up the plan, Works out each step’s state. Interface: The pane, Progress bar and status line. Note: The pane opens by itself in a fullscreen terminal wide enough to dock it. /plan-progress toggles it.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.soft{fill:var(--soft)}.dot{fill:var(--accent)}.ring{fill:var(--bg);stroke:var(--faint);stroke-width:1.2}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}a{cursor:pointer}a:hover .card,a:focus .card{stroke:var(--accent)}a:hover .arrow,a:focus .arrow{stroke:var(--accent)}a:hover .name,a:focus .name{fill:var(--accent)}a:focus{outline:none}</style>
<rect class="panel" x=".5" y=".5" width="919" height="615" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><rect class="ic" x="2.5" y="4" width="19" height="16" rx="2.5"/><path class="ic" d="M14 4v16M16.5 9h2.5M16.5 12.5h2.5M5.5 9h5M5.5 12.5h3.5"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">plan-progress</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">HOW IT WORKS</tspan><tspan dx="10">pane · status line · tool</tspan></text>
<rect class="card" x="32" y="80" width="856" height="102" rx="10"/>
<text x="46" y="134.5" class="faint caps" font-size="9.5">YOU</text>
<rect class="card" x="32" y="198" width="856" height="102" rx="10"/>
<text x="46" y="252.5" class="faint caps" font-size="9.5">CLAUDE</text>
<rect class="card" x="32" y="316" width="856" height="102" rx="10"/>
<text x="46" y="364" class="faint caps" font-size="9.5">THE</text>
<text x="46" y="377" class="faint caps" font-size="9.5">MOD</text>
<rect class="card" x="32" y="434" width="856" height="102" rx="10"/>
<text x="46" y="488.5" class="faint caps" font-size="9.5">INTERFACE</text>
<rect class="tile" x="135" y="88" width="169" height="86" rx="8"/>
<text x="147" y="108" class="fg b" font-size="12.5">Plan in plan mode</text>
<text x="147" y="124" class="muted" font-size="11">Approve the plan as you</text>
<text x="147" y="137.5" class="muted" font-size="11">always do.</text>
<rect class="tile" x="135" y="206" width="169" height="86" rx="8"/>
<text x="147" y="226" class="fg b" font-size="12.5">Writes the plan</text>
<text x="147" y="242" class="muted" font-size="11">A plan file with phases and</text>
<text x="147" y="255.5" class="muted" font-size="11">steps.</text>
<circle class="dot" cx="136" cy="207" r="9"/>
<text x="136" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">1</text>
<rect class="tile" x="517" y="206" width="169" height="86" rx="8"/>
<text x="529" y="226" class="fg b" font-size="12.5">Works through it</text>
<text x="529" y="242" class="muted" font-size="11">Creates tasks and todos, or</text>
<text x="529" y="255.5" class="muted" font-size="11">ticks the plan’s own</text>
<text x="529" y="269" class="muted" font-size="11">checkboxes.</text>
<circle class="dot" cx="518" cy="207" r="9"/>
<text x="518" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">3</text>
<rect class="tile" x="708" y="206" width="169" height="86" rx="8"/>
<text x="720" y="226" class="fg b" font-size="12.5">Marks steps</text>
<text x="720" y="241" class="faint mono" font-size="10">mark_step tool</text>
<text x="720" y="256" class="muted" font-size="11">When there are no tasks or</text>
<text x="720" y="269.5" class="muted" font-size="11">checkboxes to follow.</text>
<circle class="dot" cx="709" cy="207" r="9"/>
<text x="709" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">4</text>
<rect class="tile" x="135" y="324" width="169" height="86" rx="8"/>
<text x="147" y="344" class="fg b" font-size="12.5">Picks up the plan</text>
<text x="147" y="360" class="muted" font-size="11">Reads phases and steps from</text>
<text x="147" y="373.5" class="muted" font-size="11">the plan’s markdown.</text>
<circle class="dot" cx="136" cy="325" r="9"/>
<text x="136" y="329" class="onaccent b" font-size="10.5" text-anchor="middle">2</text>
<rect class="tile" x="517" y="324" width="360" height="86" rx="8"/>
<text x="529" y="344" class="fg b" font-size="12.5">Works out each step’s state</text>
<text x="529" y="359" class="faint mono" font-size="10">plan · tasks · todos · marks</text>
<text x="529" y="374" class="muted" font-size="11">Done, in progress or pending.</text>
<circle class="dot" cx="518" cy="325" r="9"/>
<text x="518" y="329" class="onaccent b" font-size="10.5" text-anchor="middle">5</text>
<rect class="tile" x="135" y="442" width="360" height="86" rx="8"/>
<text x="147" y="462" class="fg b" font-size="12.5">The pane</text>
<text x="147" y="477" class="faint mono" font-size="10">/plan-progress</text>
<text x="147" y="492" class="muted" font-size="11">Plan view: the plan as a document. Progress view: phases and</text>
<text x="147" y="505.5" class="muted" font-size="11">steps with a glyph each.</text>
<rect class="tile" x="517" y="442" width="360" height="86" rx="8"/>
<text x="529" y="462" class="fg b" font-size="12.5">Progress bar and status line</text>
<text x="529" y="478" class="muted" font-size="11">A count above the steps, and a summary under the prompt.</text>
<path class="arrow" d="M219.5 177V202m-5 -5l5 5 5-5"/>
<path class="arrow" d="M307 249H513m-5 -5l5 5-5 5"/>
<path class="arrow" d="M689 249H704m-5 -5l5 5-5 5"/>
<path class="arrow" d="M219.5 295V320m-5 -5l5 5 5-5"/>
<path class="arrow" d="M307 367H513m-5 -5l5 5-5 5"/>
<path class="arrow" d="M601.5 295V320m-5 -5l5 5 5-5"/>
<path class="arrow" d="M792.5 295V320m-5 -5l5 5 5-5"/>
<path class="arrow" d="M657 413V426H375V438m-5 -5l5 5 5-5"/>
<path class="arrow" d="M697 413V438m-5 -5l5 5 5-5"/>
<rect class="panel" stroke="none" style="stroke:none" x="222.5" y="300.5" width="57.7" height="14" rx="3"/>
<text x="227.5" y="311" class="muted" font-size="10" text-anchor="start">plan file</text>
<rect class="panel" stroke="none" style="stroke:none" x="604.5" y="300.5" width="73.6" height="14" rx="3"/>
<text x="609.5" y="311" class="muted" font-size="10" text-anchor="start">tasks, todos</text>
<rect class="panel" stroke="none" style="stroke:none" x="795.5" y="300.5" width="36.5" height="14" rx="3"/>
<text x="800.5" y="311" class="muted" font-size="10" text-anchor="start">marks</text>
<rect class="soft" x="32" y="552" width="856" height="38" rx="8"/>
<text x="48" y="576" class="accent caps" font-size="10.5">NOTE</text>
<text x="95.6" y="576" class="fg" font-size="12.5">The pane opens by itself in a fullscreen terminal wide enough to dock it. /plan-progress toggles it.</text>
</svg>
