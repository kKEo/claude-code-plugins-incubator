<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 498" width="920" height="498" role="img" aria-labelledby="t d">
<title id="t">How the instances-monitor plugin works</title>
<desc id="d">On disk: Session files, The process table. The mod: List them, Check them, Draw. Interface: The pane. Note: Nothing is written or sent anywhere.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.soft{fill:var(--soft)}.dot{fill:var(--accent)}.ring{fill:var(--bg);stroke:var(--faint);stroke-width:1.2}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}a{cursor:pointer}a:hover .card,a:focus .card{stroke:var(--accent)}a:hover .arrow,a:focus .arrow{stroke:var(--accent)}a:hover .name,a:focus .name{fill:var(--accent)}a:focus{outline:none}</style>
<rect class="panel" x=".5" y=".5" width="919" height="497" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><rect class="ic" x="2.5" y="4" width="19" height="16" rx="2.5"/><path class="ic" d="M14 4v16M16.5 9h2.5M16.5 12.5h2.5M5.5 9h5M5.5 12.5h3.5"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">instances-monitor</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">HOW IT WORKS</tspan><tspan dx="10">pane</tspan></text>
<rect class="card" x="32" y="80" width="856" height="102" rx="10"/>
<text x="46" y="128" class="faint caps" font-size="9.5">ON</text>
<text x="46" y="141" class="faint caps" font-size="9.5">DISK</text>
<rect class="card" x="32" y="198" width="856" height="102" rx="10"/>
<text x="46" y="246" class="faint caps" font-size="9.5">THE</text>
<text x="46" y="259" class="faint caps" font-size="9.5">MOD</text>
<rect class="card" x="32" y="316" width="856" height="102" rx="10"/>
<text x="46" y="368" class="faint caps" font-size="9.5">INTERFACE</text>
<rect class="tile" x="135" y="88" width="360" height="86" rx="8"/>
<text x="147" y="108" class="fg b" font-size="12.5">Session files</text>
<text x="147" y="124.0" class="muted" font-size="11">~/.claude/sessions/*.json: name, folder, PID,</text>
<text x="147" y="137.5" class="muted" font-size="11">status, version, start time.</text>
<rect class="tile" x="517" y="88" width="360" height="86" rx="8"/>
<text x="529" y="108" class="fg b" font-size="12.5">The process table</text>
<text x="529" y="124.0" class="muted" font-size="11">ps: which PIDs are alive, their CPU share and memory.</text>
<rect class="tile" x="135" y="206" width="169" height="86" rx="8"/>
<text x="147" y="226" class="fg b" font-size="12.5">List them</text>
<text x="147" y="242.0" class="muted" font-size="11">Read and parse every</text>
<text x="147" y="255.5" class="muted" font-size="11">session file.</text>
<circle class="dot" cx="136" cy="207" r="9"/>
<text x="136" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">1</text>
<rect class="tile" x="326" y="206" width="169" height="86" rx="8"/>
<text x="338" y="226" class="fg b" font-size="12.5">Check them</text>
<text x="338" y="242.0" class="muted" font-size="11">One ps call; drop the</text>
<text x="338" y="255.5" class="muted" font-size="11">instances that ended.</text>
<circle class="dot" cx="327" cy="207" r="9"/>
<text x="327" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">2</text>
<rect class="tile" x="517" y="206" width="169" height="86" rx="8"/>
<text x="529" y="226" class="fg b" font-size="12.5">Draw</text>
<text x="529" y="242.0" class="muted" font-size="11">Status, uptime, CPU and</text>
<text x="529" y="255.5" class="muted" font-size="11">memory per instance.</text>
<circle class="dot" cx="518" cy="207" r="9"/>
<text x="518" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">3</text>
<rect class="tile" x="135" y="324" width="360" height="86" rx="8"/>
<text x="147" y="344" class="fg b" font-size="12.5">The pane</text>
<text x="147" y="360.0" class="muted" font-size="11">/instances</text>
<text x="147" y="373.5" class="muted" font-size="11">Header totals and one entry per instance.</text>
<rect class="tile" x="517" y="324" width="360" height="86" rx="8"/>
<text x="529" y="344" class="fg b" font-size="12.5">Every 3 seconds</text>
<text x="529" y="360.0" class="muted" font-size="11">The mod repeats the cycle while</text>
<text x="529" y="373.5" class="muted" font-size="11">the session runs.</text>
<path class="arrow" d="M315 177V202m-5 -5l5 5 5-5"/>
<path class="arrow" d="M697 177V202m-5 -5l5 5 5-5"/>
<path class="arrow" d="M307 249H322m-5 -5l5 5-5 5"/>
<path class="arrow" d="M498 249H513m-5 -5l5 5-5 5"/>
<path class="arrow" d="M601.5 295V308H315V320m-5 -5l5 5 5-5"/>
<rect class="soft" x="32" y="434" width="856" height="38" rx="8"/>
<text x="48" y="458" class="accent caps" font-size="10.5">NOTE</text>
<text x="95.6" y="458" class="fg" font-size="12.5">Read only: nothing is written to disk or sent anywhere.</text>
</svg>
