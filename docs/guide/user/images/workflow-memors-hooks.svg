<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 294" width="920" height="294" role="img" aria-labelledby="t d">
<title id="t">Workflow of the memors-hooks plugin</title>
<desc id="d">1. Orient (hook); 2. Guard (hook); 3. Reuse (hook); 4. Remind (hook). Result: Claude searches before re-fetching and records what it learns. The hooks never write to the knowledge base.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.soft{fill:var(--soft)}.dot{fill:var(--accent)}.ring{fill:var(--bg);stroke:var(--faint);stroke-width:1.2}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}a{cursor:pointer}a:hover .card,a:focus .card{stroke:var(--accent)}a:hover .arrow,a:focus .arrow{stroke:var(--accent)}a:hover .name,a:focus .name{fill:var(--accent)}a:focus{outline:none}</style>
<rect class="panel" x=".5" y=".5" width="919" height="293" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26) scale(1.0)"><circle class="ic" cx="13" cy="4.6" r="2.1"/><path class="ic" d="M13 6.7V15a4.5 4.5 0 0 1-9 0v-2.2M1.6 14.6L4 12.2l2.4 2.4"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">memors-hooks</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">WORKFLOW</tspan><tspan dx="10">5 hooks · MCP server · 1 skill</tspan></text>
<rect class="card" x="32.0" y="76" width="194.5" height="138" rx="10"/>
<circle class="dot" cx="59.0" cy="103" r="11"/>
<text x="59.0" y="107" class="onaccent b" font-size="11.5" text-anchor="middle">1</text>
<text x="78.0" y="107" class="accent caps" font-size="10.5">HOOK</text>
<text x="48.0" y="135" class="fg b" font-size="14">Orient</text>
<text x="48.0" y="153" class="faint mono" font-size="11">SessionStart</text>
<text x="48.0" y="171" class="muted" font-size="12">Adds an index of what the</text>
<text x="48.0" y="187" class="muted" font-size="12">knowledge base holds.</text>
<path class="arrow" d="M231.5 145.0h16m-5 -5l5 5-5 5"/>
<rect class="card" x="252.5" y="76" width="194.5" height="138" rx="10"/>
<circle class="dot" cx="279.5" cy="103" r="11"/>
<text x="279.5" y="107" class="onaccent b" font-size="11.5" text-anchor="middle">2</text>
<text x="298.5" y="107" class="accent caps" font-size="10.5">HOOK</text>
<text x="268.5" y="135" class="fg b" font-size="14">Guard</text>
<text x="268.5" y="153" class="faint mono" font-size="11">PreToolUse · Bash</text>
<text x="268.5" y="171" class="muted" font-size="12">Blocks commands that write</text>
<text x="268.5" y="187" class="muted" font-size="12">to the knowledge base or</text>
<text x="268.5" y="203" class="muted" font-size="12">change trust.</text>
<path class="arrow" d="M452.0 145.0h16m-5 -5l5 5-5 5"/>
<rect class="card" x="473.0" y="76" width="194.5" height="138" rx="10"/>
<circle class="dot" cx="500.0" cy="103" r="11"/>
<text x="500.0" y="107" class="onaccent b" font-size="11.5" text-anchor="middle">3</text>
<text x="519.0" y="107" class="accent caps" font-size="10.5">HOOK</text>
<text x="489.0" y="135" class="fg b" font-size="14">Reuse</text>
<text x="489.0" y="153" class="faint mono" font-size="11">PostToolUse · WebFetch</text>
<text x="489.0" y="171" class="muted" font-size="12">After a web fetch, points</text>
<text x="489.0" y="187" class="muted" font-size="12">at the page already stored.</text>
<path class="arrow" d="M672.5 145.0h16m-5 -5l5 5-5 5"/>
<rect class="card" x="693.5" y="76" width="194.5" height="138" rx="10"/>
<circle class="dot" cx="720.5" cy="103" r="11"/>
<text x="720.5" y="107" class="onaccent b" font-size="11.5" text-anchor="middle">4</text>
<text x="739.5" y="107" class="accent caps" font-size="10.5">HOOK</text>
<text x="709.5" y="135" class="fg b" font-size="14">Remind</text>
<text x="709.5" y="153" class="faint mono" font-size="11">Stop</text>
<text x="709.5" y="171" class="muted" font-size="12">Once, asks Claude to record</text>
<text x="709.5" y="187" class="muted" font-size="12">what it found.</text>
<rect class="soft" x="32" y="230" width="856" height="38" rx="8"/>
<text x="48" y="254" class="accent caps" font-size="10.5">RESULT</text>
<text x="110" y="254" class="fg" font-size="12.5">Claude searches before re-fetching and records what it learns. The hooks never write to the knowledge base.</text>
</svg>
