<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 294" width="920" height="294" role="img" aria-labelledby="t d">
<title id="t">Workflow of the rigorous-review plugin</title>
<desc id="d">1. Ask (you); 2. Read (skill); 3. Check (skill); 4. Report (skill). Result: Only real findings: no praise, no style nitpicks. It never edits a file.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.soft{fill:var(--soft)}.dot{fill:var(--accent)}.ring{fill:var(--bg);stroke:var(--faint);stroke-width:1.2}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}a{cursor:pointer}a:hover .card,a:focus .card{stroke:var(--accent)}a:hover .arrow,a:focus .arrow{stroke:var(--accent)}a:hover .name,a:focus .name{fill:var(--accent)}a:focus{outline:none}</style>
<rect class="panel" x=".5" y=".5" width="919" height="293" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">rigorous-review</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">WORKFLOW</tspan><tspan dx="10">1 skill</tspan></text>
<rect class="card" x="32" y="76" width="194.5" height="138" rx="10"/>
<circle class="dot" cx="59" cy="103" r="11"/>
<text x="59" y="107" class="onaccent b" font-size="11.5" text-anchor="middle">1</text>
<text x="78" y="107" class="accent caps" font-size="10.5">YOU</text>
<text x="48" y="135" class="fg b" font-size="14">Ask</text>
<text x="48" y="153" class="faint mono" font-size="11">/rigorous-review</text>
<text x="48" y="171" class="muted" font-size="12">Name a PR, a branch or a</text>
<text x="48" y="187" class="muted" font-size="12">path, or review the current</text>
<text x="48" y="203" class="muted" font-size="12">change.</text>
<path class="arrow" d="M231.5 145h16m-5 -5l5 5-5 5"/>
<rect class="card" x="252.5" y="76" width="194.5" height="138" rx="10"/>
<circle class="dot" cx="279.5" cy="103" r="11"/>
<text x="279.5" y="107" class="onaccent b" font-size="11.5" text-anchor="middle">2</text>
<text x="298.5" y="107" class="accent caps" font-size="10.5">SKILL</text>
<text x="268.5" y="135" class="fg b" font-size="14">Read</text>
<text x="268.5" y="153" class="faint mono" font-size="11">diff + context</text>
<text x="268.5" y="171" class="muted" font-size="12">The diff and the code</text>
<text x="268.5" y="187" class="muted" font-size="12">around each hunk.</text>
<path class="arrow" d="M452 145h16m-5 -5l5 5-5 5"/>
<rect class="card" x="473" y="76" width="194.5" height="138" rx="10"/>
<circle class="dot" cx="500" cy="103" r="11"/>
<text x="500" y="107" class="onaccent b" font-size="11.5" text-anchor="middle">3</text>
<text x="519" y="107" class="accent caps" font-size="10.5">SKILL</text>
<text x="489" y="135" class="fg b" font-size="14">Check</text>
<text x="489" y="153" class="faint mono" font-size="11">--focus &lt;area&gt;</text>
<text x="489" y="171" class="muted" font-size="12">Logic, concurrency,</text>
<text x="489" y="187" class="muted" font-size="12">security, performance,</text>
<text x="489" y="203" class="muted" font-size="12">architecture.</text>
<path class="arrow" d="M672.5 145h16m-5 -5l5 5-5 5"/>
<rect class="card" x="693.5" y="76" width="194.5" height="138" rx="10"/>
<circle class="dot" cx="720.5" cy="103" r="11"/>
<text x="720.5" y="107" class="onaccent b" font-size="11.5" text-anchor="middle">4</text>
<text x="739.5" y="107" class="accent caps" font-size="10.5">SKILL</text>
<text x="709.5" y="135" class="fg b" font-size="14">Report</text>
<text x="709.5" y="153" class="faint mono" font-size="11">file:line</text>
<text x="709.5" y="171" class="muted" font-size="12">Severity, failure mode and</text>
<text x="709.5" y="187" class="muted" font-size="12">a minimal fix per finding.</text>
<rect class="soft" x="32" y="230" width="856" height="38" rx="8"/>
<text x="48" y="254" class="accent caps" font-size="10.5">RESULT</text>
<text x="112.4" y="254" class="fg" font-size="12.5">Only real findings: no praise, no style nitpicks. It never edits a file.</text>
</svg>
