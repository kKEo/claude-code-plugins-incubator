<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 734" width="920" height="734" role="img" aria-labelledby="t d">
<title id="t">How the feature-dev-documentalist plugin works</title>
<desc id="d">Hook: check-undocumented. You: Ask. Skill: Resolve the folder, Classify the phase, Dispatch one agent. Agents: Five documenter agents. On disk: The feature folder. Note: You do not have to write all five: document only the phases that matter for the feature.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.soft{fill:var(--soft)}.dot{fill:var(--accent)}.ring{fill:var(--bg);stroke:var(--faint);stroke-width:1.2}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}a{cursor:pointer}a:hover .card,a:focus .card{stroke:var(--accent)}a:hover .arrow,a:focus .arrow{stroke:var(--accent)}a:hover .name,a:focus .name{fill:var(--accent)}a:focus{outline:none}</style>
<rect class="panel" x=".5" y=".5" width="919" height="733" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">feature-dev-documentalist</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">HOW IT WORKS</tspan><tspan dx="10">1 skill · 5 agents · 1 hook</tspan></text>
<rect class="card" x="32" y="80" width="856" height="102" rx="10"/>
<text x="46" y="134.5" class="faint caps" font-size="9.5">HOOK</text>
<rect class="card" x="32" y="198" width="856" height="102" rx="10"/>
<text x="46" y="252.5" class="faint caps" font-size="9.5">YOU</text>
<rect class="card" x="32" y="316" width="856" height="102" rx="10"/>
<text x="46" y="370.5" class="faint caps" font-size="9.5">SKILL</text>
<rect class="card" x="32" y="434" width="856" height="102" rx="10"/>
<text x="46" y="488.5" class="faint caps" font-size="9.5">AGENTS</text>
<rect class="card" x="32" y="552" width="856" height="102" rx="10"/>
<text x="46" y="600" class="faint caps" font-size="9.5">ON</text>
<text x="46" y="613" class="faint caps" font-size="9.5">DISK</text>
<rect class="tile" x="135" y="88" width="169" height="86" rx="8"/>
<text x="147" y="108" class="fg b mono" font-size="11.5">check-undocumented</text>
<text x="147" y="124" class="muted" font-size="11">On a feature branch with</text>
<text x="147" y="137.5" class="muted" font-size="11">changes and no folder: a</text>
<text x="147" y="151" class="muted" font-size="11">one-line tip.</text>
<circle class="dot" cx="136" cy="89" r="9"/>
<text x="136" y="93" class="onaccent b" font-size="10.5" text-anchor="middle">1</text>
<rect class="tile" x="326" y="206" width="169" height="86" rx="8"/>
<text x="338" y="226" class="fg b" font-size="12.5">Ask</text>
<text x="338" y="241" class="faint mono" font-size="10">document this phase</text>
<text x="338" y="256" class="muted" font-size="11">Or name the phase:</text>
<text x="338" y="269.5" class="muted" font-size="11">/document-phase design</text>
<circle class="dot" cx="327" cy="207" r="9"/>
<text x="327" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">2</text>
<rect class="tile" x="326" y="324" width="169" height="86" rx="8"/>
<text x="338" y="344" class="fg b" font-size="12.5">Resolve the folder</text>
<text x="338" y="360" class="muted" font-size="11">Reuses a folder named after</text>
<text x="338" y="373.5" class="muted" font-size="11">the branch, or creates one.</text>
<circle class="dot" cx="327" cy="325" r="9"/>
<text x="327" y="329" class="onaccent b" font-size="10.5" text-anchor="middle">3</text>
<rect class="tile" x="517" y="324" width="169" height="86" rx="8"/>
<text x="529" y="344" class="fg b" font-size="12.5">Classify the phase</text>
<text x="529" y="360" class="muted" font-size="11">From the changed paths. Asks</text>
<text x="529" y="373.5" class="muted" font-size="11">you when they span several.</text>
<circle class="dot" cx="518" cy="325" r="9"/>
<text x="518" y="329" class="onaccent b" font-size="10.5" text-anchor="middle">4</text>
<rect class="tile" x="708" y="324" width="169" height="86" rx="8"/>
<text x="720" y="344" class="fg b" font-size="12.5">Dispatch one agent</text>
<text x="720" y="360" class="muted" font-size="11">Asks before overwriting an</text>
<text x="720" y="373.5" class="muted" font-size="11">existing file.</text>
<circle class="dot" cx="709" cy="325" r="9"/>
<text x="709" y="329" class="onaccent b" font-size="10.5" text-anchor="middle">5</text>
<rect class="tile" x="326" y="442" width="551" height="86" rx="8"/>
<text x="338" y="462" class="fg b" font-size="12.5">Five documenter agents</text>
<text x="338" y="477" class="faint mono" font-size="10">spec · architect · impl · deploy · testing  (haiku)</text>
<text x="338" y="492" class="muted" font-size="11">Each writes one file, after reading the phase documents already in the folder.</text>
<circle class="dot" cx="327" cy="443" r="9"/>
<text x="327" y="447" class="onaccent b" font-size="10.5" text-anchor="middle">6</text>
<rect class="tile" x="326" y="560" width="551" height="86" rx="8"/>
<text x="338" y="580" class="fg b" font-size="12.5">The feature folder</text>
<text x="338" y="595" class="faint mono" font-size="10">docs/features/YYYY-MM-DD-&lt;branch&gt;/</text>
<text x="338" y="610" class="muted" font-size="11">spec.md · design.md · implementation.md · deployment.md · testing.md</text>
<path class="arrow" d="M219.5 177V190H410.5V202m-5 -5l5 5 5-5"/>
<path class="arrow" d="M410.5 295V320m-5 -5l5 5 5-5"/>
<path class="arrow" d="M498 367H513m-5 -5l5 5-5 5"/>
<path class="arrow" d="M689 367H704m-5 -5l5 5-5 5"/>
<path class="arrow" d="M792.5 413V438m-5 -5l5 5 5-5"/>
<path class="arrow" d="M601.5 531V556m-5 -5l5 5 5-5"/>
<rect class="panel" stroke="none" style="stroke:none" x="246.4" y="183" width="137.2" height="14" rx="3"/>
<text x="315" y="193.5" class="muted" font-size="10" text-anchor="middle">tip at the end of a turn</text>
<rect class="panel" stroke="none" style="stroke:none" x="795.5" y="418.5" width="57.7" height="14" rx="3"/>
<text x="800.5" y="429" class="muted" font-size="10" text-anchor="start">one agent</text>
<rect class="panel" stroke="none" style="stroke:none" x="604.5" y="536.5" width="89.5" height="14" rx="3"/>
<text x="609.5" y="547" class="muted" font-size="10" text-anchor="start">writes one file</text>
<rect class="soft" x="32" y="670" width="856" height="38" rx="8"/>
<text x="48" y="694" class="accent caps" font-size="10.5">NOTE</text>
<text x="95.6" y="694" class="fg" font-size="12.5">You do not have to write all five: document only the phases that matter for the feature.</text>
</svg>
