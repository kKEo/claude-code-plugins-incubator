<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 498" width="920" height="498" role="img" aria-labelledby="t d">
<title id="t">How the session-cost-installer plugin works</title>
<desc id="d">You: Ask, Pick a scope, Reload. Skill: Check the marketplace, Check what is installed, Install or update, Verify and report. Claude Code: The marketplace, The installed plugins. Note: The skill stops when the released copy session-cost@km-plugins is enabled: two copies draw two panes.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.soft{fill:var(--soft)}.dot{fill:var(--accent)}.ring{fill:var(--bg);stroke:var(--faint);stroke-width:1.2}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}a{cursor:pointer}a:hover .card,a:focus .card{stroke:var(--accent)}a:hover .arrow,a:focus .arrow{stroke:var(--accent)}a:hover .name,a:focus .name{fill:var(--accent)}a:focus{outline:none}</style>
<rect class="panel" x=".5" y=".5" width="919" height="497" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 3v11m-4.5-4.5L12 14l4.5-4.5M4.5 17v2.5a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5V17"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">session-cost-installer</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">HOW IT WORKS</tspan><tspan dx="10">1 skill</tspan></text>
<rect class="card" x="32" y="80" width="856" height="102" rx="10"/>
<text x="46" y="134.5" class="faint caps" font-size="9.5">YOU</text>
<rect class="card" x="32" y="198" width="856" height="102" rx="10"/>
<text x="46" y="252.5" class="faint caps" font-size="9.5">SKILL</text>
<rect class="card" x="32" y="316" width="856" height="102" rx="10"/>
<text x="46" y="364" class="faint caps" font-size="9.5">CLAUDE</text>
<text x="46" y="377" class="faint caps" font-size="9.5">CODE</text>
<rect class="tile" x="135" y="88" width="169" height="86" rx="8"/>
<text x="147" y="108" class="fg b" font-size="12.5">Ask</text>
<text x="147" y="123" class="faint mono" font-size="10">“install session-cost”</text>
<text x="147" y="138" class="muted" font-size="11">Or use the skill's slash</text>
<text x="147" y="151.5" class="muted" font-size="11">command.</text>
<rect class="tile" x="517" y="88" width="169" height="86" rx="8"/>
<text x="529" y="108" class="fg b" font-size="12.5">Pick a scope</text>
<text x="529" y="123" class="faint mono" font-size="10">user · project · local</text>
<text x="529" y="138" class="muted" font-size="11">Optional. The default is</text>
<text x="529" y="151.5" class="muted" font-size="11">user.</text>
<rect class="tile" x="708" y="88" width="169" height="86" rx="8"/>
<text x="720" y="108" class="fg b" font-size="12.5">Reload</text>
<text x="720" y="123" class="faint mono" font-size="10">/reload-plugins</text>
<text x="720" y="138" class="muted" font-size="11">Then /session-cost opens</text>
<text x="720" y="151.5" class="muted" font-size="11">the pane.</text>
<rect class="tile" x="135" y="206" width="169" height="86" rx="8"/>
<text x="147" y="226" class="fg b" font-size="12.5">Check the marketplace</text>
<text x="147" y="242" class="muted" font-size="11">Add it when absent, refresh</text>
<text x="147" y="255.5" class="muted" font-size="11">it when present, stop on</text>
<text x="147" y="269" class="muted" font-size="11">another source.</text>
<circle class="dot" cx="136" cy="207" r="9"/>
<text x="136" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">1</text>
<rect class="tile" x="326" y="206" width="169" height="86" rx="8"/>
<text x="338" y="226" class="fg b" font-size="12.5">Check what is installed</text>
<text x="338" y="242" class="muted" font-size="11">Install, update, or stop</text>
<text x="338" y="255.5" class="muted" font-size="11">when the released copy is</text>
<text x="338" y="269" class="muted" font-size="11">enabled.</text>
<circle class="dot" cx="327" cy="207" r="9"/>
<text x="327" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">2</text>
<rect class="tile" x="517" y="206" width="169" height="86" rx="8"/>
<text x="529" y="226" class="fg b" font-size="12.5">Install or update</text>
<text x="529" y="241" class="faint mono" font-size="10">claude plugin install</text>
<text x="529" y="256" class="muted" font-size="11">Into the scope you named.</text>
<circle class="dot" cx="518" cy="207" r="9"/>
<text x="518" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">3</text>
<rect class="tile" x="708" y="206" width="169" height="86" rx="8"/>
<text x="720" y="226" class="fg b" font-size="12.5">Verify and report</text>
<text x="720" y="242" class="muted" font-size="11">Listed and enabled, with</text>
<text x="720" y="255.5" class="muted" font-size="11">the version and the next</text>
<text x="720" y="269" class="muted" font-size="11">step.</text>
<circle class="dot" cx="709" cy="207" r="9"/>
<text x="709" y="211" class="onaccent b" font-size="10.5" text-anchor="middle">4</text>
<rect class="tile" x="135" y="324" width="360" height="86" rx="8"/>
<text x="147" y="344" class="fg b" font-size="12.5">The marketplace</text>
<text x="147" y="359" class="faint mono" font-size="10">km-plugin-registry</text>
<text x="147" y="374" class="muted" font-size="11">Cloned from kKEo/claude-code-plugins-incubator on GitHub.</text>
<rect class="tile" x="517" y="324" width="360" height="86" rx="8"/>
<text x="529" y="344" class="fg b" font-size="12.5">The installed plugins</text>
<text x="529" y="359" class="faint mono" font-size="10">session-cost@km-plugin-registry</text>
<text x="529" y="374" class="muted" font-size="11">Recorded in the settings of the scope you chose.</text>
<path class="arrow" d="M219.5 177V202m-5 -5l5 5 5-5"/>
<path class="arrow" d="M307 249H322m-5 -5l5 5-5 5"/>
<path class="arrow" d="M498 249H513m-5 -5l5 5-5 5"/>
<path class="arrow" d="M689 249H704m-5 -5l5 5-5 5"/>
<path class="arrow" d="M792.5 203V178m-5 5l5-5 5 5"/>
<path class="arrow" d="M601.5 177V202m-5 -5l5 5 5-5" stroke-dasharray="4 4"/>
<path class="arrow" d="M219.5 295V320m-5 -5l5 5 5-5"/>
<path class="arrow" d="M601.5 295V320m-5 -5l5 5 5-5"/>
<rect class="panel" stroke="none" style="stroke:none" x="604.5" y="182.5" width="36.5" height="14" rx="3"/>
<text x="609.5" y="193" class="muted" font-size="10" text-anchor="start">scope</text>
<rect class="panel" stroke="none" style="stroke:none" x="222.5" y="300.5" width="30" height="14" rx="3"/>
<text x="227.5" y="311" class="muted" font-size="10" text-anchor="start">adds</text>
<rect class="panel" stroke="none" style="stroke:none" x="604.5" y="300.5" width="44" height="14" rx="3"/>
<text x="609.5" y="311" class="muted" font-size="10" text-anchor="start">installs</text>
<rect class="soft" x="32" y="434" width="856" height="38" rx="8"/>
<text x="48" y="458" class="accent caps" font-size="10.5">NOTE</text>
<text x="95.6" y="458" class="fg" font-size="12.5">The skill stops when the released copy session-cost@km-plugins is enabled: two copies draw two panes.</text>
</svg>
