<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-labelledby="t d">
<title id="t">A mod can stop a risky action</title>
<desc id="d">When Claude wants to edit a protected file, the mod stops the edit before it happens and Claude is told why. When Claude wants to edit an ordinary file, the edit goes ahead as usual. Unlike a written instruction, a guard is not something Claude can forget.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.hot{fill:var(--soft);stroke:var(--accent)}.softbox{fill:var(--soft);stroke:none}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.arrowa{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:4 4}.ah{fill:var(--faint)}.aha{fill:var(--accent)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.dot{fill:var(--accent)}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1L9 5L0 9z"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 1L9 5L0 9z"/></marker></defs>
<rect class="panel" x=".5" y=".5" width="919" height="399" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">a guard</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">CHECKED BEFORE IT HAPPENS</tspan><tspan dx="10">every time</tspan></text>
<rect class="card" x="32" y="84" width="270" height="104" rx="10"/>
<text x="52" y="124" class="muted" font-size="14">Claude wants to edit</text>
<text x="52" y="154" class="fg mono sb" font-size="14.5" xml:space="preserve">.env  (your secrets)</text>
<rect class="hot" x="346" y="84" width="188" height="104" rx="10"/>
<g transform="translate(366 118) scale(1.5)"><path class="ic" d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path class="ic" d="M9 9l6 6M15 9l-6 6"/></g>
<text x="414" y="132" class="fg b" font-size="16">The mod</text>
<text x="414" y="156" class="muted" font-size="14">checks it</text>
<rect class="tile" x="578" y="84" width="310" height="104" rx="10" stroke-dasharray="5 5"/>
<text x="598" y="124" class="fg b" font-size="17">Stopped</text>
<text x="598" y="150.0" class="muted" font-size="13.5">Claude is told why: “That file is</text>
<text x="598" y="169.2" class="muted" font-size="13.5">protected.”</text>
<path class="arrow" d="M305 136L343 136" marker-end="url(#ah)"/>
<path class="arrow dash" d="M537 136L575 136" marker-end="url(#ah)"/>
<rect class="card" x="32" y="204" width="270" height="104" rx="10"/>
<text x="52" y="244" class="muted" font-size="14">Claude wants to edit</text>
<text x="52" y="274" class="fg mono sb" font-size="14.5" xml:space="preserve">app.ts  (ordinary code)</text>
<rect class="hot" x="346" y="204" width="188" height="104" rx="10"/>
<g transform="translate(366 238) scale(1.5)"><path class="ic" d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path class="ic" d="M8.5 12l2.5 2.5 4.5-5"/></g>
<text x="414" y="252" class="fg b" font-size="16">The mod</text>
<text x="414" y="276" class="muted" font-size="14">checks it</text>
<rect class="tile" x="578" y="204" width="310" height="104" rx="10"/>
<text x="598" y="244" class="fg b" font-size="17">Goes ahead</text>
<text x="598" y="270.0" class="muted" font-size="13.5">Exactly as it would without the mod.</text>
<path class="arrow" d="M305 256L343 256" marker-end="url(#ah)"/>
<path class="arrowa" d="M537 256L575 256" marker-end="url(#aha)"/>
<rect class="softbox" x="32" y="332" width="856" height="40" rx="8"/>
<text x="460" y="357" class="fg" font-size="14.5" text-anchor="middle">An instruction is a request Claude may forget. A guard is a rule the app itself enforces.</text>
</svg>
