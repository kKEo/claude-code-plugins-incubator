<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" width="920" height="350" role="img" aria-labelledby="t d">
<title id="t">A mod adds commands and buttons</title>
<desc id="d">You type a slash command the mod added, for example slash session-cost. The mod answers: it opens its panel or prints a line. Inside the panel you press its buttons to switch views.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.hot{fill:var(--soft);stroke:var(--accent)}.softbox{fill:var(--soft);stroke:none}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.arrowa{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:4 4}.ah{fill:var(--faint)}.aha{fill:var(--accent)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.dot{fill:var(--accent)}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1L9 5L0 9z"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 1L9 5L0 9z"/></marker></defs>
<rect class="panel" x=".5" y=".5" width="919" height="349" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">commands and buttons</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">YOU ARE IN CHARGE</tspan><tspan dx="10">open it, close it, switch views</tspan></text>
<rect class="card" x="32" y="84" width="276" height="236" rx="10"/>
<circle class="dot" cx="64" cy="118" r="12"/>
<text x="64" y="122.5" class="onaccent b" font-size="12.5" text-anchor="middle">1</text>
<text x="88" y="124" class="fg b" font-size="16.5">You type a command</text>
<text x="52" y="158.0" class="muted" font-size="14">One the mod added to Claude Code.</text>
<path class="arrow" d="M310 202L320 202" marker-end="url(#ah)"/>
<rect class="hot" x="322" y="84" width="276" height="236" rx="10"/>
<circle class="dot" cx="354" cy="118" r="12"/>
<text x="354" y="122.5" class="onaccent b" font-size="12.5" text-anchor="middle">2</text>
<text x="378" y="124" class="fg b" font-size="16.5">The mod answers</text>
<text x="342" y="158.0" class="muted" font-size="14">It opens its panel, or prints a</text>
<text x="342" y="177.9" class="muted" font-size="14">line.</text>
<path class="arrow" d="M600 202L610 202" marker-end="url(#ah)"/>
<rect class="card" x="612" y="84" width="276" height="236" rx="10"/>
<circle class="dot" cx="644" cy="118" r="12"/>
<text x="644" y="122.5" class="onaccent b" font-size="12.5" text-anchor="middle">3</text>
<text x="668" y="124" class="fg b" font-size="16.5">You press its buttons</text>
<text x="632" y="158.0" class="muted" font-size="14">Switch views without typing.</text>
<rect class="tile" x="52" y="230" width="236" height="44" rx="8"/>
<text x="68" y="258" class="fg mono sb" font-size="15">&gt; /session-cost</text>
<rect class="tile" x="342" y="220" width="236" height="76" rx="8"/>
<text x="358" y="246" class="fg b" font-size="14">Costs</text>
<text x="358" y="272" class="muted" font-size="12.5">Request 12</text>
<text x="562" y="272" class="fg" font-size="12.5" text-anchor="end">$0.04</text>
<rect class="hot" x="632" y="236" width="72" height="34" rx="8"/>
<text x="668" y="258" class="fg sb" font-size="12.5" text-anchor="middle">Requests</text>
<rect class="tile" x="712" y="236" width="72" height="34" rx="8"/>
<text x="748" y="258" class="muted" font-size="12.5" text-anchor="middle">Models</text>
<rect class="tile" x="792" y="236" width="72" height="34" rx="8"/>
<text x="828" y="258" class="muted" font-size="12.5" text-anchor="middle">Days</text>
</svg>
