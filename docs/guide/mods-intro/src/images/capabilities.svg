<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" role="img" aria-labelledby="t d">
<title id="t">Six things a mod can do</title>
<desc id="d">One, show information on screen. Two, add commands and buttons. Three, stop or adjust risky actions. Four, give Claude extra context. Five, work in the background. Six, remember between sessions.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.hot{fill:var(--soft);stroke:var(--accent)}.softbox{fill:var(--soft);stroke:none}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.arrowa{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:4 4}.ah{fill:var(--faint)}.aha{fill:var(--accent)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.dot{fill:var(--accent)}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1L9 5L0 9z"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 1L9 5L0 9z"/></marker></defs>
<rect class="panel" x=".5" y=".5" width="919" height="429" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">what a mod can do</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">SIX CAPABILITIES</tspan><tspan dx="10">the next slides take them one by one</tspan></text>
<rect class="card" x="32" y="84" width="276" height="148" rx="10"/>
<circle class="dot" cx="64" cy="120" r="12"/>
<text x="64" y="124.5" class="onaccent b" font-size="12.5" text-anchor="middle">1</text>
<text x="88" y="126" class="fg b" font-size="17">Show information</text>
<text x="52" y="164.0" class="muted" font-size="14.5">A panel, a row, a status line or</text>
<text x="52" y="184.6" class="muted" font-size="14.5">a short pop-up.</text>
<rect class="card" x="322" y="84" width="276" height="148" rx="10"/>
<circle class="dot" cx="354" cy="120" r="12"/>
<text x="354" y="124.5" class="onaccent b" font-size="12.5" text-anchor="middle">2</text>
<text x="378" y="126" class="fg b" font-size="17">Add commands</text>
<text x="342" y="164.0" class="muted" font-size="14.5">New slash commands, and buttons</text>
<text x="342" y="184.6" class="muted" font-size="14.5">you can press.</text>
<rect class="card" x="612" y="84" width="276" height="148" rx="10"/>
<circle class="dot" cx="644" cy="120" r="12"/>
<text x="644" y="124.5" class="onaccent b" font-size="12.5" text-anchor="middle">3</text>
<text x="668" y="126" class="fg b" font-size="17">Stop risky actions</text>
<text x="632" y="164.0" class="muted" font-size="14.5">Check what Claude is about to do,</text>
<text x="632" y="184.6" class="muted" font-size="14.5">and say no.</text>
<rect class="card" x="32" y="248" width="276" height="148" rx="10"/>
<circle class="dot" cx="64" cy="284" r="12"/>
<text x="64" y="288.5" class="onaccent b" font-size="12.5" text-anchor="middle">4</text>
<text x="88" y="290" class="fg b" font-size="17">Give Claude context</text>
<text x="52" y="328.0" class="muted" font-size="14.5">Quietly add facts Claude should</text>
<text x="52" y="348.6" class="muted" font-size="14.5">know.</text>
<rect class="card" x="322" y="248" width="276" height="148" rx="10"/>
<circle class="dot" cx="354" cy="284" r="12"/>
<text x="354" y="288.5" class="onaccent b" font-size="12.5" text-anchor="middle">5</text>
<text x="378" y="290" class="fg b" font-size="17">Work in the background</text>
<text x="342" y="328.0" class="muted" font-size="14.5">Check something every minute,</text>
<text x="342" y="348.6" class="muted" font-size="14.5">with no prompt.</text>
<rect class="card" x="612" y="248" width="276" height="148" rx="10"/>
<circle class="dot" cx="644" cy="284" r="12"/>
<text x="644" y="288.5" class="onaccent b" font-size="12.5" text-anchor="middle">6</text>
<text x="668" y="290" class="fg b" font-size="17">Remember</text>
<text x="632" y="328.0" class="muted" font-size="14.5">Keep notes and totals from one</text>
<text x="632" y="348.6" class="muted" font-size="14.5">day to the next.</text>
</svg>
