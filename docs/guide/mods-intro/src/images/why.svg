<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="920" height="370" role="img" aria-labelledby="t d">
<title id="t">Three reasons to use mods</title>
<desc id="d">See more: costs, plans and progress stay on screen while Claude works. Stay safe: a risky action is stopped before it runs, every time. Save steps: what you check by hand is checked for you in the background.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.hot{fill:var(--soft);stroke:var(--accent)}.softbox{fill:var(--soft);stroke:none}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.arrowa{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:4 4}.ah{fill:var(--faint)}.aha{fill:var(--accent)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.dot{fill:var(--accent)}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1L9 5L0 9z"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 1L9 5L0 9z"/></marker></defs>
<rect class="panel" x=".5" y=".5" width="919" height="369" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">why mods</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">THREE REASONS</tspan><tspan dx="10">shape the tool to your work</tspan></text>
<rect class="card" x="32" y="84" width="276" height="250" rx="10"/>
<rect class="tile" x="52" y="104" width="56" height="56" rx="12"/>
<g transform="translate(62 114) scale(1.5)"><path class="ic" d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle class="ic" cx="12" cy="12" r="3"/></g>
<text x="52" y="200" class="fg b" font-size="20">See more</text>
<text x="52" y="232.0" class="muted" font-size="14.5">Costs, plans and progress stay</text>
<text x="52" y="252.6" class="muted" font-size="14.5">on screen while Claude works. No</text>
<text x="52" y="273.2" class="muted" font-size="14.5">need to ask.</text>
<rect class="card" x="322" y="84" width="276" height="250" rx="10"/>
<rect class="tile" x="342" y="104" width="56" height="56" rx="12"/>
<g transform="translate(352 114) scale(1.5)"><path class="ic" d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path class="ic" d="M8.5 12l2.5 2.5 4.5-5"/></g>
<text x="342" y="200" class="fg b" font-size="20">Stay safe</text>
<text x="342" y="232.0" class="muted" font-size="14.5">A risky action is stopped before</text>
<text x="342" y="252.6" class="muted" font-size="14.5">it runs. Every time, not only</text>
<text x="342" y="273.2" class="muted" font-size="14.5">when Claude remembers.</text>
<rect class="card" x="612" y="84" width="276" height="250" rx="10"/>
<rect class="tile" x="632" y="104" width="56" height="56" rx="12"/>
<g transform="translate(642 114) scale(1.5)"><path class="ic" d="M13 2L4 14h7l-1 8 9-12h-7z"/></g>
<text x="632" y="200" class="fg b" font-size="20">Save steps</text>
<text x="632" y="232.0" class="muted" font-size="14.5">What you keep checking by hand</text>
<text x="632" y="252.6" class="muted" font-size="14.5">gets checked for you, in the</text>
<text x="632" y="273.2" class="muted" font-size="14.5">background.</text>
</svg>
