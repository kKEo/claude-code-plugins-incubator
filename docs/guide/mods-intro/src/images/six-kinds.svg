<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 516" width="920" height="516" role="img" aria-labelledby="t d">
<title id="t">Six kinds of extension in plain words</title>
<desc id="d">A skill teaches Claude: a written procedure Claude follows. An agent is a specialised helper Claude hands a task to. A slash command is a shortcut you type yourself. A hook is a small script Claude Code runs by itself at a fixed moment. A connector, also called an MCP server, connects Claude to another system. A mod changes Claude Code itself: what you see on screen and what is allowed to happen. A plugin is the package that delivers any of them.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.hot{fill:var(--soft);stroke:var(--accent)}.softbox{fill:var(--soft);stroke:none}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.arrowa{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:4 4}.ah{fill:var(--faint)}.aha{fill:var(--accent)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.dot{fill:var(--accent)}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1L9 5L0 9z"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 1L9 5L0 9z"/></marker></defs>
<rect class="panel" x=".5" y=".5" width="919" height="515" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">six kinds of extension</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">IN PLAIN WORDS</tspan><tspan dx="10">who or what gets changed</tspan></text>
<rect class="card" x="32" y="84" width="276" height="170" rx="10"/>
<text x="52" y="124" class="fg b" font-size="19">A skill</text>
<text x="52" y="148" class="faint caps" font-size="10">TEACHES CLAUDE</text>
<text x="52" y="180.0" class="muted" font-size="14.5">A written procedure Claude</text>
<text x="52" y="200.6" class="muted" font-size="14.5">follows: how to review a change,</text>
<text x="52" y="221.2" class="muted" font-size="14.5">how to cut a release.</text>
<rect class="card" x="322" y="84" width="276" height="170" rx="10"/>
<text x="342" y="124" class="fg b" font-size="19">An agent</text>
<text x="342" y="148" class="faint caps" font-size="10">HELPS CLAUDE</text>
<text x="342" y="180.0" class="muted" font-size="14.5">A specialised helper Claude hands</text>
<text x="342" y="200.6" class="muted" font-size="14.5">a task to. It works on its own</text>
<text x="342" y="221.2" class="muted" font-size="14.5">and reports back.</text>
<rect class="card" x="612" y="84" width="276" height="170" rx="10"/>
<text x="632" y="124" class="fg b" font-size="19">A slash command</text>
<text x="632" y="148" class="faint caps" font-size="10">YOU TYPE IT</text>
<text x="632" y="180.0" class="muted" font-size="14.5">A shortcut you type yourself,</text>
<text x="632" y="200.6" class="muted" font-size="14.5">such as /plugin install, to start</text>
<text x="632" y="221.2" class="muted" font-size="14.5">an action right away.</text>
<rect class="card" x="32" y="268" width="276" height="170" rx="10"/>
<text x="52" y="308" class="fg b" font-size="19">A hook</text>
<text x="52" y="332" class="faint caps" font-size="10">RUNS BY ITSELF</text>
<text x="52" y="364.0" class="muted" font-size="14.5">A small script Claude Code runs</text>
<text x="52" y="384.6" class="muted" font-size="14.5">by itself at a fixed moment,</text>
<text x="52" y="405.2" class="muted" font-size="14.5">such as the end of a turn.</text>
<rect class="card" x="322" y="268" width="276" height="170" rx="10"/>
<text x="342" y="308" class="fg b" font-size="19">A connector (MCP)</text>
<text x="342" y="332" class="faint caps" font-size="10">CONNECTS CLAUDE</text>
<text x="342" y="364.0" class="muted" font-size="14.5">Gives Claude access to another</text>
<text x="342" y="384.6" class="muted" font-size="14.5">system: an issue tracker, a</text>
<text x="342" y="405.2" class="muted" font-size="14.5">database, a browser. Also called</text>
<text x="342" y="425.8" class="muted" font-size="14.5">an MCP server.</text>
<rect class="hot" x="612" y="268" width="276" height="170" rx="10"/>
<text x="632" y="308" class="fg b" font-size="19">A mod</text>
<text x="632" y="332" class="accent caps" font-size="10">CHANGES CLAUDE CODE</text>
<text x="632" y="364.0" class="muted" font-size="14.5">Changes the app itself: what you</text>
<text x="632" y="384.6" class="muted" font-size="14.5">see on screen, and what is</text>
<text x="632" y="405.2" class="muted" font-size="14.5">allowed to happen.</text>
<rect class="softbox" x="32" y="456" width="856" height="40" rx="8"/>
<text x="460" y="481" class="fg" font-size="14.5" text-anchor="middle">A plugin is the package. One plugin can deliver any mix of the six.</text>
</svg>
