<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" role="img" aria-labelledby="t d">
<title id="t">Four mods you can install from this marketplace</title>
<desc id="d">session-cost shows what every request costs. plan-progress shows the plan being ticked off step by step. prompt-coach corrects the English of your own prompts and lets you practise. instances-monitor lists all your running Claude Code sessions.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.hot{fill:var(--soft);stroke:var(--accent)}.softbox{fill:var(--soft);stroke:none}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.arrowa{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:4 4}.ah{fill:var(--faint)}.aha{fill:var(--accent)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.dot{fill:var(--accent)}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1L9 5L0 9z"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 1L9 5L0 9z"/></marker></defs>
<rect class="panel" x=".5" y=".5" width="919" height="439" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">four mods</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">READY TO INSTALL</tspan><tspan dx="10">each is a panel beside the conversation</tspan></text>
<rect class="card" x="32" y="84" width="420" height="150" rx="10"/>
<text x="52" y="122" class="fg b" font-size="18.5">See what you spend</text>
<rect class="softbox" x="305" y="100" width="127" height="30" rx="6"/>
<text x="317" y="119.68" class="fg mono" font-size="13">/session-cost</text>
<text x="52" y="146" class="accent mono sb" font-size="13">session-cost</text>
<text x="52" y="176.0" class="muted" font-size="14">Every request with its tokens and cost, and totals by</text>
<text x="52" y="195.9" class="muted" font-size="14">model and by day.</text>
<rect class="card" x="468" y="84" width="420" height="150" rx="10"/>
<text x="488" y="122" class="fg b" font-size="18.5">Watch the plan advance</text>
<rect class="softbox" x="733" y="100" width="135" height="30" rx="6"/>
<text x="745" y="119.68" class="fg mono" font-size="13">/plan-progress</text>
<text x="488" y="146" class="accent mono sb" font-size="13">plan-progress</text>
<text x="488" y="176.0" class="muted" font-size="14">The current plan with each step marked done, in</text>
<text x="488" y="195.9" class="muted" font-size="14">progress or pending.</text>
<rect class="card" x="32" y="250" width="420" height="150" rx="10"/>
<text x="52" y="288" class="fg b" font-size="18.5">Write better English</text>
<rect class="softbox" x="305" y="266" width="127" height="30" rx="6"/>
<text x="317" y="285.68" class="fg mono" font-size="13">/prompt-coach</text>
<text x="52" y="312" class="accent mono sb" font-size="13">prompt-coach</text>
<text x="52" y="342.0" class="muted" font-size="14">A correction for each prompt you type, and a practice</text>
<text x="52" y="361.9" class="muted" font-size="14">game built from your own mistakes.</text>
<rect class="card" x="468" y="250" width="420" height="150" rx="10"/>
<text x="488" y="288" class="fg b" font-size="18.5">See all your sessions</text>
<rect class="softbox" x="765" y="266" width="103" height="30" rx="6"/>
<text x="777" y="285.68" class="fg mono" font-size="13">/instances</text>
<text x="488" y="312" class="accent mono sb" font-size="13">instances-monitor</text>
<text x="488" y="342.0" class="muted" font-size="14">Every Claude Code session on your machine: busy or</text>
<text x="488" y="361.9" class="muted" font-size="14">idle, memory and uptime.</text>
</svg>
