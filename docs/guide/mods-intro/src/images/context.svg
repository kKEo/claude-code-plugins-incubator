<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="920" height="370" role="img" aria-labelledby="t d">
<title id="t">A mod can give Claude extra context</title>
<desc id="d">You type a prompt such as fix the failing test. The mod quietly adds facts Claude should know, such as the current branch and the house rules of the project. Claude reads both. You see your own prompt, unchanged.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.hot{fill:var(--soft);stroke:var(--accent)}.softbox{fill:var(--soft);stroke:none}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.arrowa{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:4 4}.ah{fill:var(--faint)}.aha{fill:var(--accent)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.dot{fill:var(--accent)}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1L9 5L0 9z"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 1L9 5L0 9z"/></marker></defs>
<rect class="panel" x=".5" y=".5" width="919" height="369" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">extra context</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">CLAUDE STARTS BETTER INFORMED</tspan><tspan dx="10">you type less</tspan></text>
<rect class="card" x="32" y="84" width="250" height="190" rx="10"/>
<text x="52" y="122" class="fg b" font-size="17">You type</text>
<rect class="tile" x="52" y="146" width="210" height="44" rx="8"/>
<text x="66" y="174" class="fg" font-size="14.5">fix the failing test</text>
<text x="52" y="222.0" class="muted" font-size="13.5">Your prompt stays exactly as</text>
<text x="52" y="241.2" class="muted" font-size="13.5">you wrote it.</text>
<rect class="hot" x="326" y="84" width="268" height="190" rx="10"/>
<text x="346" y="122" class="fg b" font-size="17">The mod adds</text>
<rect class="softbox" x="346" y="144" width="228" height="32" rx="6"/>
<text x="358" y="164.68" class="fg mono" font-size="13">+ branch: feature/login</text>
<rect class="softbox" x="346" y="184" width="228" height="32" rx="6"/>
<text x="358" y="204.68" class="fg mono" font-size="13">+ project house rules</text>
<rect class="softbox" x="346" y="224" width="228" height="32" rx="6"/>
<text x="358" y="244.68" class="fg mono" font-size="13">+ what CI said last</text>
<rect class="card" x="638" y="84" width="250" height="190" rx="10"/>
<text x="658" y="122" class="fg b" font-size="17">Claude reads both</text>
<text x="658" y="156.0" class="muted" font-size="14.5">It knows where it is and</text>
<text x="658" y="176.6" class="muted" font-size="14.5">which rules apply, before</text>
<text x="658" y="197.2" class="muted" font-size="14.5">the first step.</text>
<path class="arrow" d="M285 178L323 178" marker-end="url(#ah)"/>
<path class="arrowa" d="M597 178L635 178" marker-end="url(#aha)"/>
<rect class="softbox" x="32" y="300" width="856" height="40" rx="8"/>
<text x="460" y="325" class="fg" font-size="14.5" text-anchor="middle">The same idea as a good briefing: the facts arrive with the task, without you repeating them.</text>
</svg>
