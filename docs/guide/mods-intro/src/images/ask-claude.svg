<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img" aria-labelledby="t d">
<title id="t">You can ask Claude to make a mod</title>
<desc id="d">You describe the mod in a sentence. Claude writes it and asks once before turning it on. The mod appears in your session, and reloads each time Claude edits it.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.hot{fill:var(--soft);stroke:var(--accent)}.softbox{fill:var(--soft);stroke:none}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.arrowa{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:4 4}.ah{fill:var(--faint)}.aha{fill:var(--accent)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.dot{fill:var(--accent)}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1L9 5L0 9z"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 1L9 5L0 9z"/></marker></defs>
<rect class="panel" x=".5" y=".5" width="919" height="359" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">no code needed</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">DESCRIBE IT</tspan><tspan dx="10">Claude writes mods too</tspan></text>
<rect class="card" x="32" y="84" width="300" height="240" rx="10"/>
<circle class="dot" cx="62" cy="118" r="12"/>
<text x="62" y="122.5" class="onaccent b" font-size="12.5" text-anchor="middle">1</text>
<text x="86" y="124" class="fg b" font-size="17">You describe it</text>
<rect class="tile" x="52" y="150" width="260" height="104" rx="10"/>
<text x="68" y="180.0" class="fg" font-size="14">“make a mod that shows how long</text>
<text x="68" y="199.9" class="fg" font-size="14">the last turn took, above the</text>
<text x="68" y="219.8" class="fg" font-size="14">prompt”</text>
<text x="52" y="284.0" class="muted" font-size="13.5">One sentence is enough to start.</text>
<rect class="hot" x="366" y="84" width="250" height="240" rx="10"/>
<circle class="dot" cx="396" cy="118" r="12"/>
<text x="396" y="122.5" class="onaccent b" font-size="12.5" text-anchor="middle">2</text>
<text x="420" y="124" class="fg b" font-size="17">Claude writes it</text>
<text x="386" y="160.0" class="muted" font-size="14.5">It creates the files for you</text>
<text x="386" y="180.6" class="muted" font-size="14.5">and asks once before turning</text>
<text x="386" y="201.2" class="muted" font-size="14.5">the mod on.</text>
<rect class="card" x="650" y="84" width="238" height="240" rx="10"/>
<circle class="dot" cx="680" cy="118" r="12"/>
<text x="680" y="122.5" class="onaccent b" font-size="12.5" text-anchor="middle">3</text>
<text x="704" y="124" class="fg b" font-size="17">It appears</text>
<rect class="hot" x="670" y="150" width="198" height="30" rx="6"/>
<text x="682" y="170" class="fg" font-size="13">Last turn: 42 s</text>
<text x="670" y="214.0" class="muted" font-size="14.5">Ask for a change and it</text>
<text x="670" y="234.6" class="muted" font-size="14.5">updates in the same</text>
<text x="670" y="255.2" class="muted" font-size="14.5">session.</text>
<path class="arrow" d="M335 204L363 204" marker-end="url(#ah)"/>
<path class="arrowa" d="M619 204L647 204" marker-end="url(#aha)"/>
</svg>
