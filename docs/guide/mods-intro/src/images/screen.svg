<text x="562" y="226" class="fg" font-size="12.5" text-anchor="end">$0.02</text>
<text x="402" y="252" class="fg sb" font-size="12.5">Today</text>
<text x="562" y="252" class="fg sb" font-size="12.5" text-anchor="end">$1.87</text>
