<rect class="hot" x="388" y="118" width="188" height="200" rx="8"/>
<text x="402" y="144" class="fg b" font-size="14.5">Costs</text>
<text x="402" y="174" class="muted" font-size="12.5">Request 12</text>
<text x="562" y="174" class="fg" font-size="12.5" text-anchor="end">$0.04</text>
<text x="402" y="200" class="muted" font-size="12.5">Request 11</text>
<text x="562" y="200" class="fg" font-size="12.5" text-anchor="end">$0.11</text>
