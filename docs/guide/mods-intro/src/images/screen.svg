<text x="64" y="323" class="fg" font-size="12.5">Last turn: 42 s · 7 tool calls</text>
<rect class="tile" x="52" y="342" width="524" height="36" rx="8"/>
<text x="66" y="365" class="faint" font-size="13.5">&gt;</text>
<text x="52" y="404" class="accent sb" font-size="12.5">CI: passing · $0.42 this session</text>
<circle class="dot" cx="576" cy="118" r="12"/>
<text x="576" y="122.5" class="onaccent b" font-size="12.5" text-anchor="middle">1</text>
<circle class="dot" cx="376" cy="304" r="12"/>
<text x="376" y="308.5" class="onaccent b" font-size="12.5" text-anchor="middle">2</text>
<circle class="dot" cx="300" cy="400" r="12"/>
<text x="300" y="404.5" class="onaccent b" font-size="12.5" text-anchor="middle">3</text>
<circle class="dot" cx="376" cy="92" r="12"/>
<text x="376" y="96.5" class="onaccent b" font-size="12.5" text-anchor="middle">4</text>
<rect class="card" x="612" y="84" width="276" height="80" rx="10"/>
<circle class="dot" cx="636" cy="110" r="12"/>
<text x="636" y="114.5" class="onaccent b" font-size="12.5" text-anchor="middle">1</text>
<text x="658" y="115" class="fg b" font-size="15.5">A panel</text>
<text x="628" y="138" class="muted" font-size="12.5">Beside the conversation. For anything</text>
<text x="628" y="154" class="muted" font-size="12.5">that should stay in view.</text>
<rect class="card" x="612" y="172" width="276" height="80" rx="10"/>
