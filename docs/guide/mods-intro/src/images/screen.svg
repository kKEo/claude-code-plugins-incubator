<text x="636" y="202.5" class="onaccent b" font-size="12.5" text-anchor="middle">2</text>
<text x="658" y="203" class="fg b" font-size="15.5">A row</text>
<text x="628" y="226" class="muted" font-size="12.5">Above the prompt. A line of facts, with</text>
<text x="628" y="242" class="muted" font-size="12.5">a button or two.</text>
<rect class="card" x="612" y="260" width="276" height="80" rx="10"/>
<circle class="dot" cx="636" cy="286" r="12"/>
<text x="636" y="290.5" class="onaccent b" font-size="12.5" text-anchor="middle">3</text>
<text x="658" y="291" class="fg b" font-size="15.5">A status line</text>
<text x="628" y="314" class="muted" font-size="12.5">Under the prompt. One short fact, always</text>
<text x="628" y="330" class="muted" font-size="12.5">there.</text>
<rect class="card" x="612" y="348" width="276" height="80" rx="10"/>
<circle class="dot" cx="636" cy="374" r="12"/>
<text x="636" y="378.5" class="onaccent b" font-size="12.5" text-anchor="middle">4</text>
<text x="658" y="379" class="fg b" font-size="15.5">A pop-up note</text>
<text x="628" y="402" class="muted" font-size="12.5">For something that just happened. It</text>
<text x="628" y="418" class="muted" font-size="12.5">fades by itself.</text>
</svg>
