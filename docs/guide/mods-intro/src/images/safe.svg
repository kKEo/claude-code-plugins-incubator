<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="920" height="380" role="img" aria-labelledby="t d">
<title id="t">Is a mod safe to install</title>
<desc id="d">A mod is real code: it runs on your machine with your own rights, like any program you install. Choose your source: install mods from people you trust or whose code someone has read. You stay in control: turn a mod off or remove it at any time, and an organization can restrict which mods load.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.hot{fill:var(--soft);stroke:var(--accent)}.softbox{fill:var(--soft);stroke:none}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.arrowa{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:4 4}.ah{fill:var(--faint)}.aha{fill:var(--accent)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.dot{fill:var(--accent)}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1L9 5L0 9z"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 1L9 5L0 9z"/></marker></defs>
<rect class="panel" x=".5" y=".5" width="919" height="379" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">is it safe?</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">TREAT IT LIKE ANY PROGRAM</tspan><tspan dx="10">three things to know</tspan></text>
<rect class="card" x="32" y="84" width="276" height="260" rx="10"/>
<text x="52" y="124" class="fg b" font-size="19">It is real code</text>
<text x="52" y="162.0" class="muted" font-size="14.5">A mod runs on your machine with</text>
<text x="52" y="182.6" class="muted" font-size="14.5">your own rights, like any</text>
<text x="52" y="203.2" class="muted" font-size="14.5">program you install. It is not</text>
<text x="52" y="223.8" class="muted" font-size="14.5">locked in a box.</text>
<rect class="hot" x="322" y="84" width="276" height="260" rx="10"/>
<text x="342" y="124" class="fg b" font-size="19">Choose your source</text>
<text x="342" y="162.0" class="muted" font-size="14.5">Install mods from people you</text>
<text x="342" y="182.6" class="muted" font-size="14.5">trust, or ones whose code</text>
<text x="342" y="203.2" class="muted" font-size="14.5">someone on your team has read.</text>
<rect class="card" x="612" y="84" width="276" height="260" rx="10"/>
<text x="632" y="124" class="fg b" font-size="19">You stay in control</text>
<text x="632" y="162.0" class="muted" font-size="14.5">Turn a mod off or remove it at</text>
<text x="632" y="182.6" class="muted" font-size="14.5">any time in /plugin. An</text>
<text x="632" y="203.2" class="muted" font-size="14.5">organization can restrict which</text>
<text x="632" y="223.8" class="muted" font-size="14.5">mods load.</text>
</svg>
