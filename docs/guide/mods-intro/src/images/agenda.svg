<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="920" height="250" role="img" aria-labelledby="t d">
<title id="t">The three parts of this deck</title>
<desc id="d">Part one, what a mod is. Part two, what mods can do. Part three, mods you can install today.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.hot{fill:var(--soft);stroke:var(--accent)}.softbox{fill:var(--soft);stroke:none}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.arrowa{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:4 4}.ah{fill:var(--faint)}.aha{fill:var(--accent)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.dot{fill:var(--accent)}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1L9 5L0 9z"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 1L9 5L0 9z"/></marker></defs>
<rect class="panel" x=".5" y=".5" width="919" height="249" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">the route</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">THREE PARTS</tspan><tspan dx="10">about fifteen minutes</tspan></text>
<rect class="card" x="32" y="84" width="276" height="126" rx="10"/>
<circle class="dot" cx="62" cy="114" r="12"/>
<text x="62" y="118.5" class="onaccent b" font-size="12.5" text-anchor="middle">1</text>
<text x="86" y="120" class="fg b" font-size="18">What a mod is</text>
<text x="52" y="156.0" class="muted" font-size="14.5">A small add-on that changes</text>
<text x="52" y="176.6" class="muted" font-size="14.5">Claude Code itself</text>
<path class="arrow" d="M310 147L320 147" marker-end="url(#ah)"/>
<rect class="card" x="322" y="84" width="276" height="126" rx="10"/>
<circle class="dot" cx="352" cy="114" r="12"/>
<text x="352" y="118.5" class="onaccent b" font-size="12.5" text-anchor="middle">2</text>
<text x="376" y="120" class="fg b" font-size="18">What mods can do</text>
<text x="342" y="156.0" class="muted" font-size="14.5">Show, guard, inform, watch and</text>
<text x="342" y="176.6" class="muted" font-size="14.5">remember</text>
<path class="arrow" d="M600 147L610 147" marker-end="url(#ah)"/>
<rect class="hot" x="612" y="84" width="276" height="126" rx="10"/>
<circle class="dot" cx="642" cy="114" r="12"/>
<text x="642" y="118.5" class="onaccent b" font-size="12.5" text-anchor="middle">3</text>
<text x="666" y="120" class="fg b" font-size="18">Mods to install today</text>
<text x="632" y="156.0" class="muted" font-size="14.5">Four ready-made mods and how to</text>
<text x="632" y="176.6" class="muted" font-size="14.5">get them</text>
</svg>
