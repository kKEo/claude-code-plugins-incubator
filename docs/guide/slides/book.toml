[book]
title = "Claude Code for engineers: a slide deck"
description = "An introduction to Claude Code for experienced engineers, one slide per page, ending with examples from this marketplace."
authors = ["Krzysztof Maziarz"]
language = "en"
src = "src"

[build]
build-dir = "../../../site/slides"
create-missing = false

[output.html]
site-url = "/claude-code-plugins-incubator/slides/"
git-repository-url = "https://github.com/kKEo/claude-code-plugins-incubator"
no-section-label = true
additional-css = ["slides.css"]
additional-js = ["slides.js"]
