<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410" role="img" aria-labelledby="t d">
<title id="t">How the ci-watch example mod works</title>
<desc id="d">Session start: Start a timer. Every tick: Run gh, Pin the status line, Compare with last time. On a new failure: Notify, Wake the session. Note: A prompt a mod submits waits until the session is idle. It never lands in the middle of a running turn.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.hot{fill:var(--soft);stroke:var(--accent)}.softbox{fill:var(--soft);stroke:none}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.arrowa{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:4 4}.ah{fill:var(--faint)}.aha{fill:var(--accent)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.dot{fill:var(--accent)}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1L9 5L0 9z"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 1L9 5L0 9z"/></marker></defs>
<rect class="panel" x=".5" y=".5" width="919" height="409" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">ci-watch</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">EXAMPLE 5</tspan><tspan dx="10">$.clock · $.process · status line · notify · $.prompt.submit</tspan></text>
<rect class="card" x="32" y="80" width="856" height="78" rx="10"/>
<text x="46" y="116" class="faint caps" font-size="9.5">SESSION</text>
<text x="46" y="129" class="faint caps" font-size="9.5">START</text>
<rect class="tile" x="135" y="88" width="745" height="62" rx="8"/>
<text x="147" y="108" class="fg b" font-size="12.5">Start a timer</text>
<text x="147" y="124" class="muted" font-size="11">$.clock.every at the intervalSeconds option. No event drives this mod.</text>
<rect class="card" x="32" y="174" width="856" height="81" rx="10"/>
<text x="46" y="211.5" class="faint caps" font-size="9.5">EVERY</text>
<text x="46" y="224.5" class="faint caps" font-size="9.5">TICK</text>
<rect class="tile" x="135" y="182" width="233.667" height="65" rx="8"/>
<text x="147" y="202" class="fg b" font-size="12.5">Run gh</text>
<text x="147" y="218" class="muted" font-size="11">$.process.run asks for the latest</text>
<text x="147" y="231.5" class="muted" font-size="11">workflow run as JSON.</text>
<path class="arrow" d="M371.667 214.5L387.667 214.5" marker-end="url(#ah)"/>
<rect class="tile" x="390.667" y="182" width="233.667" height="65" rx="8"/>
<text x="402.667" y="202" class="fg b" font-size="12.5">Pin the status line</text>
<text x="402.667" y="218" class="muted" font-size="11">$.ui.status(&#x27;CI success: build&#x27;)</text>
<path class="arrow" d="M627.333 214.5L643.333 214.5" marker-end="url(#ah)"/>
<rect class="tile" x="646.333" y="182" width="233.667" height="65" rx="8"/>
<text x="658.333" y="202" class="fg b" font-size="12.5">Compare with last time</text>
<text x="658.333" y="218" class="muted" font-size="11">Only a change to failure counts as news.</text>
<rect class="card" x="32" y="271" width="856" height="81" rx="10"/>
<text x="46" y="308.5" class="faint caps" font-size="9.5">ON A NEW</text>
<text x="46" y="321.5" class="faint caps" font-size="9.5">FAILURE</text>
<rect class="tile" x="135" y="279" width="361.5" height="65" rx="8"/>
<text x="147" y="299" class="fg b" font-size="12.5">Notify</text>
<text x="147" y="315" class="muted" font-size="11">$.ui.notify raises a native notification by your own channel.</text>
<path class="arrow" d="M499.5 311.5L515.5 311.5" marker-end="url(#ah)"/>
<rect class="hot" x="518.5" y="279" width="361.5" height="65" rx="8"/>
<text x="530.5" y="299" class="fg b" font-size="12.5">Wake the session</text>
<text x="530.5" y="315" class="muted" font-size="11">With the wake option on, $.prompt.submit queues a prompt that</text>
<text x="530.5" y="328.5" class="muted" font-size="11">starts a turn.</text>
<rect class="softbox" x="32" y="368" width="856" height="34" rx="8"/>
<text x="46" y="389.5" class="fg" font-size="12">A prompt a mod submits waits until the session is idle. It never lands in the middle of a running turn.</text>
</svg>
