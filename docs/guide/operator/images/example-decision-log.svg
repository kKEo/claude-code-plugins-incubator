<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 462" width="920" height="462" role="img" aria-labelledby="t d">
<title id="t">How the decision-log example mod works</title>
<desc id="d">Session start: Register a tool, Register a command, Load the store. The model: Chooses between options, Calls the tool. The mod: tool.run answers, Write $.state, Write $.store. The interface: The Decisions pane.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.hot{fill:var(--soft);stroke:var(--accent)}.softbox{fill:var(--soft);stroke:none}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.arrowa{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:4 4}.ah{fill:var(--faint)}.aha{fill:var(--accent)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.dot{fill:var(--accent)}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1L9 5L0 9z"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 1L9 5L0 9z"/></marker></defs>
<rect class="panel" x=".5" y=".5" width="919" height="461" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">decision-log</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">EXAMPLE 3</tspan><tspan dx="10">$.tool.register · tool.run · pane · $.store</tspan></text>
<rect class="card" x="32" y="80" width="856" height="81" rx="10"/>
<text x="46" y="117.5" class="faint caps" font-size="9.5">SESSION</text>
<text x="46" y="130.5" class="faint caps" font-size="9.5">START</text>
<rect class="tile" x="135" y="88" width="233.667" height="65" rx="8"/>
<text x="147" y="108" class="fg b" font-size="12.5">Register a tool</text>
<text x="147" y="124" class="muted" font-size="11">record_decision, listed as</text>
<text x="147" y="137.5" class="muted" font-size="11">mcp__decision-log__record_decision.</text>
<rect class="tile" x="390.667" y="88" width="233.667" height="65" rx="8"/>
<text x="402.667" y="108" class="fg b" font-size="12.5">Register a command</text>
<text x="402.667" y="124" class="muted" font-size="11">/decisions opens the pane.</text>
<rect class="tile" x="646.333" y="88" width="233.667" height="65" rx="8"/>
<text x="658.333" y="108" class="fg b" font-size="12.5">Load the store</text>
<text x="658.333" y="124" class="muted" font-size="11">Decisions kept for this project by earlier</text>
<text x="658.333" y="137.5" class="muted" font-size="11">sessions.</text>
<rect class="card" x="32" y="177" width="856" height="78" rx="10"/>
<text x="46" y="213" class="faint caps" font-size="9.5">THE</text>
<text x="46" y="226" class="faint caps" font-size="9.5">MODEL</text>
<rect class="tile" x="135" y="185" width="361.5" height="62" rx="8"/>
<text x="147" y="205" class="fg b" font-size="12.5">Chooses between options</text>
<text x="147" y="221" class="muted" font-size="11">The tool&#x27;s description tells it when a decision is worth recording.</text>
<path class="arrow" d="M499.5 216L515.5 216" marker-end="url(#ah)"/>
<rect class="tile" x="518.5" y="185" width="361.5" height="62" rx="8"/>
<text x="530.5" y="205" class="fg b" font-size="12.5">Calls the tool</text>
<text x="530.5" y="221" class="muted" font-size="11">With what was decided and why.</text>
<rect class="card" x="32" y="271" width="856" height="81" rx="10"/>
<text x="46" y="308.5" class="faint caps" font-size="9.5">THE</text>
<text x="46" y="321.5" class="faint caps" font-size="9.5">MOD</text>
<rect class="hot" x="135" y="279" width="233.667" height="65" rx="8"/>
<text x="147" y="299" class="fg b mono" font-size="12">tool.run answers</text>
<text x="147" y="315" class="muted" font-size="11">The hook returns { result }, which the</text>
<text x="147" y="328.5" class="muted" font-size="11">model reads as the tool&#x27;s output.</text>
<path class="arrow" d="M371.667 311.5L387.667 311.5" marker-end="url(#ah)"/>
<rect class="tile" x="390.667" y="279" width="233.667" height="65" rx="8"/>
<text x="402.667" y="299" class="fg b" font-size="12.5">Write $.state</text>
<text x="402.667" y="315" class="muted" font-size="11">The pane reads it, so it is drawn again.</text>
<path class="arrow" d="M627.333 311.5L643.333 311.5" marker-end="url(#ah)"/>
<rect class="tile" x="646.333" y="279" width="233.667" height="65" rx="8"/>
<text x="658.333" y="299" class="fg b" font-size="12.5">Write $.store</text>
<text x="658.333" y="315" class="muted" font-size="11">The list survives the session.</text>
<rect class="card" x="32" y="368" width="856" height="78" rx="10"/>
<text x="46" y="404" class="faint caps" font-size="9.5">THE</text>
<text x="46" y="417" class="faint caps" font-size="9.5">INTERFACE</text>
<rect class="tile" x="135" y="376" width="745" height="62" rx="8"/>
<text x="147" y="396" class="fg b" font-size="12.5">The Decisions pane</text>
<text x="147" y="412" class="muted" font-size="11">Each decision in bold with its reason under it.</text>
</svg>
