<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="920" height="600" role="img" aria-labelledby="t d">
<title id="t">Where a mod draws in the interface</title>
<desc id="d">Six places: a pane beside the chat opened with $.ui.open; a band row above the prompt; a status line under the prompt set with $.ui.status; a toast from $.ui.toast; a tool call&#x27;s row in the transcript; and a slash command registered with $.command.register.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.hot{fill:var(--soft);stroke:var(--accent)}.softbox{fill:var(--soft);stroke:none}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.arrowa{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:4 4}.ah{fill:var(--faint)}.aha{fill:var(--accent)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.dot{fill:var(--accent)}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1L9 5L0 9z"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 1L9 5L0 9z"/></marker></defs>
<rect class="panel" x=".5" y=".5" width="919" height="599" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">where a mod draws</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">SIX SITES</tspan><tspan dx="10">one mod may use several</tspan></text>
<rect class="card" x="32" y="80" width="856" height="284" rx="10"/>
<text x="52" y="108" class="fg mono" font-size="11.5">&gt; fix the failing login test</text>
<text x="52" y="140" class="fg mono" font-size="11.5">● Bash(npm test -- login)</text>
<text x="52" y="158" class="muted mono" font-size="11.5">  ⎿ 1 failed, 11 passed</text>
<text x="52" y="190" class="fg mono" font-size="11.5">● Edit(src/auth/session.ts)</text>
<text x="52" y="208" class="muted mono" font-size="11.5">  ⎿ 2 lines changed</text>
<circle class="dot" cx="262" cy="136" r="9.5"/>
<text x="262" y="139.8" class="onaccent b" font-size="11" text-anchor="middle">5</text>
<rect class="hot" x="376" y="92" width="208" height="28" rx="8"/>
<text x="388" y="110.5" class="fg" font-size="11.5">That turn took 131s</text>
<circle class="dot" cx="584" cy="92" r="9.5"/>
<text x="584" y="95.8" class="onaccent b" font-size="11" text-anchor="middle">4</text>
<rect class="tile" x="48" y="232" width="536" height="28" rx="8"/>
<text x="60" y="250.5" class="muted mono" font-size="11">Last turn: 42s, 3 tool calls   [ Hide ]</text>
<circle class="dot" cx="584" cy="232" r="9.5"/>
<text x="584" y="235.8" class="onaccent b" font-size="11" text-anchor="middle">2</text>
<rect class="tile" x="48" y="270" width="536" height="36" rx="8"/>
<text x="60" y="292.5" class="fg mono" font-size="12">&gt; /decisions</text>
<circle class="dot" cx="584" cy="270" r="9.5"/>
<text x="584" y="273.8" class="onaccent b" font-size="11" text-anchor="middle">6</text>
<text x="52" y="334" class="faint mono" font-size="11">CI success: build</text>
<text x="52" y="350" class="faint mono" font-size="11">? for shortcuts</text>
<circle class="dot" cx="190" cy="330" r="9.5"/>
<text x="190" y="333.8" class="onaccent b" font-size="11" text-anchor="middle">3</text>
<rect class="tile" x="604" y="92" width="268" height="256" rx="8"/>
<text x="618" y="114" class="fg b" font-size="12.5">Decisions</text>
<path class="rule" d="M604 126H872"/>
<text x="618" y="148" class="fg sb" font-size="11.5">1. Use SQLite</text>
<text x="618" y="164" class="muted" font-size="11.5">One file, no server.</text>
<text x="618" y="190" class="fg sb" font-size="11.5">2. Tokens refresh on read</text>
<text x="618" y="206" class="muted" font-size="11.5">A stale token failed the test.</text>
<circle class="dot" cx="872" cy="92" r="9.5"/>
<text x="872" y="95.8" class="onaccent b" font-size="11" text-anchor="middle">1</text>
<rect class="card" x="32" y="380" width="274.667" height="92" rx="10"/>
<circle class="dot" cx="54.0" cy="402" r="9.5"/>
<text x="54" y="405.8" class="onaccent b" font-size="11" text-anchor="middle">1</text>
<text x="72" y="406.5" class="fg b" font-size="12.5">Pane</text>
<text x="46" y="427" class="accent mono" font-size="10.5">$.ui.open({ id, title })</text>
<text x="46" y="444" class="muted" font-size="11">Drawn by a ui.render hook for the Pane</text>
<text x="46" y="457.5" class="muted" font-size="11">component. Docked beside the chat, or inline.</text>
<rect class="card" x="322.667" y="380" width="274.667" height="92" rx="10"/>
<circle class="dot" cx="344.6666666666667" cy="402" r="9.5"/>
<text x="344.667" y="405.8" class="onaccent b" font-size="11" text-anchor="middle">2</text>
<text x="362.667" y="406.5" class="fg b" font-size="12.5">Band</text>
<text x="336.667" y="427" class="accent mono" font-size="10.5">ui.render, AbovePrompt</text>
<text x="336.667" y="444" class="muted" font-size="11">One row per mod above the prompt. Return</text>
<text x="336.667" y="457.5" class="muted" font-size="11">next(e) to draw none.</text>
<rect class="card" x="613.333" y="380" width="274.667" height="92" rx="10"/>
<circle class="dot" cx="635.3333333333334" cy="402" r="9.5"/>
<text x="635.333" y="405.8" class="onaccent b" font-size="11" text-anchor="middle">3</text>
<text x="653.333" y="406.5" class="fg b" font-size="12.5">Status line</text>
<text x="627.333" y="427" class="accent mono" font-size="10.5">$.ui.status(text)</text>
<text x="627.333" y="444" class="muted" font-size="11">One pinned line per mod under the prompt.</text>
<text x="627.333" y="457.5" class="muted" font-size="11">undefined clears it.</text>
<rect class="card" x="32" y="484" width="274.667" height="92" rx="10"/>
<circle class="dot" cx="54.0" cy="506" r="9.5"/>
<text x="54" y="509.8" class="onaccent b" font-size="11" text-anchor="middle">4</text>
<text x="72" y="510.5" class="fg b" font-size="12.5">Toast</text>
<text x="46" y="531" class="accent mono" font-size="10.5">$.ui.toast(text)</text>
<text x="46" y="548" class="muted" font-size="11">A short line that leaves by itself, after four</text>
<text x="46" y="561.5" class="muted" font-size="11">seconds by default.</text>
<rect class="card" x="322.667" y="484" width="274.667" height="92" rx="10"/>
<circle class="dot" cx="344.6666666666667" cy="506" r="9.5"/>
<text x="344.667" y="509.8" class="onaccent b" font-size="11" text-anchor="middle">5</text>
<text x="362.667" y="510.5" class="fg b" font-size="12.5">Transcript row</text>
<text x="336.667" y="531" class="accent mono" font-size="10.5">ui.render, ToolUse</text>
<text x="336.667" y="548" class="muted" font-size="11">Draw on or under a tool call&#x27;s row. Keep await</text>
<text x="336.667" y="561.5" class="muted" font-size="11">next(e) in the tree to keep the row.</text>
<rect class="card" x="613.333" y="484" width="274.667" height="92" rx="10"/>
<circle class="dot" cx="635.3333333333334" cy="506" r="9.5"/>
<text x="635.333" y="509.8" class="onaccent b" font-size="11" text-anchor="middle">6</text>
<text x="653.333" y="510.5" class="fg b" font-size="12.5">Slash command</text>
<text x="627.333" y="531" class="accent mono" font-size="10.5">$.command.register({ name })</text>
<text x="627.333" y="548" class="muted" font-size="11">Registered in session.start and answered by a</text>
<text x="627.333" y="561.5" class="muted" font-size="11">command.run hook.</text>
</svg>
