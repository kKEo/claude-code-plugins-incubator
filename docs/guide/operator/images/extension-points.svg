<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 524" width="920" height="524" role="img" aria-labelledby="t d">
<title id="t">Six ways to extend Claude Code</title>
<desc id="d">Skill: instructions Claude reads when a prompt matches. Agent: a helper with its own context. Slash command: a prompt you run by name. Command hook: a shell command run at an event. MCP server: a process that gives the model tools. Mod: TypeScript loaded into the session that hooks engine events and draws in the interface.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.hot{fill:var(--soft);stroke:var(--accent)}.softbox{fill:var(--soft);stroke:none}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.arrowa{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:4 4}.ah{fill:var(--faint)}.aha{fill:var(--accent)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.dot{fill:var(--accent)}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1L9 5L0 9z"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 1L9 5L0 9z"/></marker></defs>
<rect class="panel" x=".5" y=".5" width="919" height="523" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">extending Claude Code</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">SIX MECHANISMS</tspan><tspan dx="10">pick by who starts it</tspan></text>
<rect class="card" x="32" y="80" width="274" height="176" rx="10"/>
<text x="48" y="106" class="faint caps" font-size="9.5">CLAUDE PICKS IT</text>
<text x="48" y="130" class="fg b mono" font-size="15">skill</text>
<text x="48" y="148" class="muted mono" font-size="10.5">skills/&lt;name&gt;/SKILL.md</text>
<text x="48" y="171" class="muted" font-size="12">Instructions Claude reads when your</text>
<text x="48" y="186.5" class="muted" font-size="12">prompt matches the description. The</text>
<text x="48" y="202" class="muted" font-size="12">workhorse for a repeatable workflow.</text>
<rect class="tile" x="48" y="224" width="74.36" height="20" rx="10"/>
<text x="85.18" y="238" class="muted sb" font-size="11" text-anchor="middle">Markdown</text>
<rect class="card" x="323" y="80" width="274" height="176" rx="10"/>
<text x="339" y="106" class="faint caps" font-size="9.5">CLAUDE DISPATCHES IT</text>
<text x="339" y="130" class="fg b mono" font-size="15">agent</text>
<text x="339" y="148" class="muted mono" font-size="10.5">agents/&lt;name&gt;.md</text>
<text x="339" y="171" class="muted" font-size="12">A helper with its own context window,</text>
<text x="339" y="186.5" class="muted" font-size="12">model and tool list. It works alone and</text>
<text x="339" y="202" class="muted" font-size="12">returns one summary.</text>
<rect class="tile" x="339" y="224" width="74.36" height="20" rx="10"/>
<text x="376.18" y="238" class="muted sb" font-size="11" text-anchor="middle">Markdown</text>
<rect class="card" x="614" y="80" width="274" height="176" rx="10"/>
<text x="630" y="106" class="faint caps" font-size="9.5">YOU TYPE IT</text>
<text x="630" y="130" class="fg b mono" font-size="15">slash command</text>
<text x="630" y="148" class="muted mono" font-size="10.5">commands/&lt;name&gt;.md</text>
<text x="630" y="171" class="muted" font-size="12">A prompt you run by name, with arguments.</text>
<text x="630" y="186.5" class="muted" font-size="12">Good for one narrow, explicit action.</text>
<rect class="tile" x="630" y="224" width="74.36" height="20" rx="10"/>
<text x="667.18" y="238" class="muted sb" font-size="11" text-anchor="middle">Markdown</text>
<rect class="card" x="32" y="272" width="274" height="176" rx="10"/>
<text x="48" y="298" class="faint caps" font-size="9.5">AN EVENT FIRES IT</text>
<text x="48" y="322" class="fg b mono" font-size="15">command hook</text>
<text x="48" y="340" class="muted mono" font-size="10.5">hooks/hooks.json, a script</text>
<text x="48" y="363" class="muted" font-size="12">A shell command the engine runs at an</text>
<text x="48" y="378.5" class="muted" font-size="12">event. The event arrives as JSON on stdin,</text>
<text x="48" y="394" class="muted" font-size="12">the answer leaves on stdout.</text>
<rect class="tile" x="48" y="416" width="88.11" height="20" rx="10"/>
<text x="92.055" y="430" class="muted sb" font-size="11" text-anchor="middle">any language</text>
<rect class="card" x="323" y="272" width="274" height="176" rx="10"/>
<text x="339" y="298" class="faint caps" font-size="9.5">THE MODEL CALLS IT</text>
<text x="339" y="322" class="fg b mono" font-size="15">MCP server</text>
<text x="339" y="340" class="muted mono" font-size="10.5">.mcp.json</text>
<text x="339" y="363" class="muted" font-size="12">A separate process that gives the model</text>
<text x="339" y="378.5" class="muted" font-size="12">new tools, usually to reach a system</text>
<text x="339" y="394" class="muted" font-size="12">outside the session.</text>
<rect class="tile" x="339" y="416" width="88.11" height="20" rx="10"/>
<text x="383.055" y="430" class="muted sb" font-size="11" text-anchor="middle">any language</text>
<rect class="hot" x="614" y="272" width="274" height="176" rx="10"/>
<text x="630" y="298" class="accent caps" font-size="9.5">LOADED INTO THE SESSION</text>
<text x="630" y="322" class="fg b mono" font-size="15">mod</text>
<text x="630" y="340" class="muted mono" font-size="10.5">hooks/hooks.json, a module</text>
<text x="630" y="363" class="muted" font-size="12">Code that sits in the path of engine events</text>
<text x="630" y="378.5" class="muted" font-size="12">and draws in the interface: panes, bands,</text>
<text x="630" y="394" class="muted" font-size="12">status lines.</text>
<rect class="tile" x="630" y="416" width="76.67" height="20" rx="10"/>
<text x="668.335" y="430" class="muted sb" font-size="11" text-anchor="middle">TypeScript</text>
<rect class="tile" x="712.67" y="416" width="85.91" height="20" rx="10"/>
<text x="755.625" y="430" class="muted sb" font-size="11" text-anchor="middle">early access</text>
<rect class="softbox" x="32" y="464" width="856" height="34" rx="8"/>
<text x="46" y="485.5" class="fg" font-size="12">Teach Claude a workflow: skill. React to an event: command hook. Change the interface or what flows through a session: mod.</text>
</svg>
