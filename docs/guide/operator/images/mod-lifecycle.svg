<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 507" width="920" height="507" role="img" aria-labelledby="t d">
<title id="t">The life of a mod inside one session</title>
<desc id="d">Load: Read the folder, Compile the module, register(on, options). Run: session.start, Dispatches, Timers. Reload: You save a file, A fresh copy loads, What survives. End: session.end, /clear. Note: New code meets old values after a reload: tag a stored shape, and change the tag when the shape changes.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.hot{fill:var(--soft);stroke:var(--accent)}.softbox{fill:var(--soft);stroke:none}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.arrowa{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:4 4}.ah{fill:var(--faint)}.aha{fill:var(--accent)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.dot{fill:var(--accent)}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1L9 5L0 9z"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 1L9 5L0 9z"/></marker></defs>
<rect class="panel" x=".5" y=".5" width="919" height="506" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">lifecycle</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">FROM LOAD TO UNLOAD</tspan><tspan dx="10">what runs when</tspan></text>
<rect class="card" x="32" y="80" width="856" height="81" rx="10"/>
<text x="46" y="124" class="faint caps" font-size="9.5">LOAD</text>
<rect class="tile" x="135" y="88" width="233.667" height="65" rx="8"/>
<text x="147" y="108" class="fg b" font-size="12.5">Read the folder</text>
<text x="147" y="124" class="muted" font-size="11">plugin.json, then hooks/hooks.json, which</text>
<text x="147" y="137.5" class="muted" font-size="11">names one module.</text>
<path class="arrow" d="M371.667 120.5L387.667 120.5" marker-end="url(#ah)"/>
<rect class="tile" x="390.667" y="88" width="233.667" height="65" rx="8"/>
<text x="402.667" y="108" class="fg b" font-size="12.5">Compile the module</text>
<text x="402.667" y="124" class="muted" font-size="11">TypeScript and JSX are compiled by the</text>
<text x="402.667" y="137.5" class="muted" font-size="11">engine. There is no build step.</text>
<path class="arrow" d="M627.333 120.5L643.333 120.5" marker-end="url(#ah)"/>
<rect class="tile" x="646.333" y="88" width="233.667" height="65" rx="8"/>
<text x="658.333" y="108" class="fg b mono" font-size="12">register(on, options)</text>
<text x="658.333" y="124" class="muted" font-size="11">Runs once. options holds the userConfig</text>
<text x="658.333" y="137.5" class="muted" font-size="11">values.</text>
<rect class="card" x="32" y="177" width="856" height="81" rx="10"/>
<text x="46" y="221" class="faint caps" font-size="9.5">RUN</text>
<rect class="tile" x="135" y="185" width="233.667" height="65" rx="8"/>
<text x="147" y="205" class="fg b mono" font-size="12">session.start</text>
<text x="147" y="221" class="muted" font-size="11">Awaited before the first prompt, so a tool</text>
<text x="147" y="234.5" class="muted" font-size="11">registered here is listed by turn one.</text>
<rect class="tile" x="390.667" y="185" width="233.667" height="65" rx="8"/>
<text x="402.667" y="205" class="fg b" font-size="12.5">Dispatches</text>
<text x="402.667" y="221" class="muted" font-size="11">Each event runs your hook with its own</text>
<text x="402.667" y="234.5" class="muted" font-size="11">time budget.</text>
<rect class="tile" x="646.333" y="185" width="233.667" height="65" rx="8"/>
<text x="658.333" y="205" class="fg b" font-size="12.5">Timers</text>
<text x="658.333" y="221" class="muted" font-size="11">$.clock.every and $.clock.after keep</text>
<text x="658.333" y="234.5" class="muted" font-size="11">work alive between events.</text>
<rect class="card" x="32" y="274" width="856" height="81" rx="10"/>
<text x="46" y="318" class="faint caps" font-size="9.5">RELOAD</text>
<rect class="tile" x="135" y="282" width="233.667" height="65" rx="8"/>
<text x="147" y="302" class="fg b" font-size="12.5">You save a file</text>
<text x="147" y="318" class="muted" font-size="11">A folder under development is watched.</text>
<text x="147" y="331.5" class="muted" font-size="11">Installed copies are not.</text>
<path class="arrow" d="M371.667 314.5L387.667 314.5" marker-end="url(#ah)"/>
<rect class="tile" x="390.667" y="282" width="233.667" height="65" rx="8"/>
<text x="402.667" y="302" class="fg b" font-size="12.5">A fresh copy loads</text>
<text x="402.667" y="318" class="muted" font-size="11">register and session.start run again. A</text>
<text x="402.667" y="331.5" class="muted" font-size="11">reload that fails keeps the old copy.</text>
<path class="arrow" d="M627.333 314.5L643.333 314.5" marker-end="url(#ah)"/>
<rect class="hot" x="646.333" y="282" width="233.667" height="65" rx="8"/>
<text x="658.333" y="302" class="fg b" font-size="12.5">What survives</text>
<text x="658.333" y="318" class="muted" font-size="11">$.state and $.store stay. Module</text>
<text x="658.333" y="331.5" class="muted" font-size="11">variables and every timers are gone.</text>
<rect class="card" x="32" y="371" width="856" height="78" rx="10"/>
<text x="46" y="413.5" class="faint caps" font-size="9.5">END</text>
<rect class="tile" x="135" y="379" width="361.5" height="62" rx="8"/>
<text x="147" y="399" class="fg b mono" font-size="12">session.end</text>
<text x="147" y="415" class="muted" font-size="11">One short wall-clock bound to save what matters.</text>
<rect class="tile" x="518.5" y="379" width="361.5" height="62" rx="8"/>
<text x="530.5" y="399" class="fg b" font-size="12.5">/clear</text>
<text x="530.5" y="415" class="muted" font-size="11">Raises session.end with reason clear, and no session.start after it.</text>
<rect class="softbox" x="32" y="465" width="856" height="34" rx="8"/>
<text x="46" y="486.5" class="fg" font-size="12">New code meets old values after a reload: tag a stored shape, and change the tag when the shape changes.</text>
</svg>
