<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 453" width="920" height="453" role="img" aria-labelledby="t d">
<title id="t">What the engine does when a hook fails, with and without a catch handler</title>
<desc id="d">No .catch: Your guard throws, The hook is skipped, The chain goes on, The tool runs. With .catch: Your guard throws, The handler is asked, It answers, The tool is refused. Time budgets: 10 s per dispatch, 1 s for .catch, 5 s to linger, 30 s of $ calls. Note: A failing mod never takes the session down. The price is that a guard must say what happens when it fails.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.hot{fill:var(--soft);stroke:var(--accent)}.softbox{fill:var(--soft);stroke:none}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.arrowa{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:4 4}.ah{fill:var(--faint)}.aha{fill:var(--accent)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.dot{fill:var(--accent)}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1L9 5L0 9z"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 1L9 5L0 9z"/></marker></defs>
<rect class="panel" x=".5" y=".5" width="919" height="452" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">when a hook fails</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">FAIL OPEN OR FAIL CLOSED</tspan><tspan dx="10">throw · wrong shape · out of time</tspan></text>
<rect class="card" x="32" y="80" width="856" height="94.5" rx="10"/>
<text x="46" y="124.25" class="faint caps" font-size="9.5">NO</text>
<text x="46" y="137.25" class="faint caps" font-size="9.5">.CATCH</text>
<rect class="tile" x="135" y="88" width="169.75" height="78.5" rx="8"/>
<text x="147" y="108" class="fg b" font-size="12.5">Your guard throws</text>
<text x="147" y="124" class="muted" font-size="11">Or answers a wrong shape,</text>
<text x="147" y="137.5" class="muted" font-size="11">or outlasts its budget.</text>
<path class="arrow" d="M307.75 127.25L323.75 127.25" marker-end="url(#ah)"/>
<rect class="tile" x="326.75" y="88" width="169.75" height="78.5" rx="8"/>
<text x="338.75" y="108" class="fg b" font-size="12.5">The hook is skipped</text>
<text x="338.75" y="124" class="muted" font-size="11">Only this hook. One dim line</text>
<text x="338.75" y="137.5" class="muted" font-size="11">names the mod, the event</text>
<text x="338.75" y="151" class="muted" font-size="11">and the reason.</text>
<path class="arrow" d="M499.5 127.25L515.5 127.25" marker-end="url(#ah)"/>
<rect class="tile" x="518.5" y="88" width="169.75" height="78.5" rx="8"/>
<text x="530.5" y="108" class="fg b" font-size="12.5">The chain goes on</text>
<text x="530.5" y="124" class="muted" font-size="11">The hooks beneath and the</text>
<text x="530.5" y="137.5" class="muted" font-size="11">engine run as if yours were</text>
<text x="530.5" y="151" class="muted" font-size="11">absent.</text>
<path class="arrow" d="M691.25 127.25L707.25 127.25" marker-end="url(#ah)"/>
<rect class="hot" x="710.25" y="88" width="169.75" height="78.5" rx="8"/>
<text x="722.25" y="108" class="fg b" font-size="12.5">The tool runs</text>
<text x="722.25" y="124" class="muted" font-size="11">A guard without a handler</text>
<text x="722.25" y="137.5" class="muted" font-size="11">fails open.</text>
<rect class="card" x="32" y="190.5" width="856" height="94.5" rx="10"/>
<text x="46" y="234.75" class="faint caps" font-size="9.5">WITH</text>
<text x="46" y="247.75" class="faint caps" font-size="9.5">.CATCH</text>
<rect class="tile" x="135" y="198.5" width="169.75" height="78.5" rx="8"/>
<text x="147" y="218.5" class="fg b" font-size="12.5">Your guard throws</text>
<text x="147" y="234.5" class="muted" font-size="11">The same failure, in a hook</text>
<text x="147" y="248" class="muted" font-size="11">registered with .catch(...).</text>
<path class="arrow" d="M307.75 237.75L323.75 237.75" marker-end="url(#ah)"/>
<rect class="tile" x="326.75" y="198.5" width="169.75" height="78.5" rx="8"/>
<text x="338.75" y="218.5" class="fg b" font-size="12.5">The handler is asked</text>
<text x="338.75" y="234.5" class="muted" font-size="11">It gets a fresh second of its</text>
<text x="338.75" y="248" class="muted" font-size="11">own and reads next.error.</text>
<path class="arrow" d="M499.5 237.75L515.5 237.75" marker-end="url(#ah)"/>
<rect class="tile" x="518.5" y="198.5" width="169.75" height="78.5" rx="8"/>
<text x="530.5" y="218.5" class="fg b" font-size="12.5">It answers</text>
<text x="530.5" y="234.5" class="accent mono" font-size="10.5">next.called ? next(e)</text>
<text x="530.5" y="248" class="accent mono" font-size="10.5">  : { deny: &#x27;why&#x27; }</text>
<path class="arrow" d="M691.25 237.75L707.25 237.75" marker-end="url(#ah)"/>
<rect class="hot" x="710.25" y="198.5" width="169.75" height="78.5" rx="8"/>
<text x="722.25" y="218.5" class="fg b" font-size="12.5">The tool is refused</text>
<text x="722.25" y="234.5" class="muted" font-size="11">The guard fails closed,</text>
<text x="722.25" y="248" class="muted" font-size="11">which is what a guard</text>
<text x="722.25" y="261.5" class="muted" font-size="11">should do.</text>
<rect class="card" x="32" y="301" width="856" height="94.5" rx="10"/>
<text x="46" y="345.25" class="faint caps" font-size="9.5">TIME</text>
<text x="46" y="358.25" class="faint caps" font-size="9.5">BUDGETS</text>
<rect class="tile" x="135" y="309" width="169.75" height="78.5" rx="8"/>
<text x="147" y="329" class="fg b" font-size="12.5">10 s per dispatch</text>
<text x="147" y="345" class="muted" font-size="11">Your own code only. Time</text>
<text x="147" y="358.5" class="muted" font-size="11">inside next(e) or a $ call</text>
<text x="147" y="372" class="muted" font-size="11">does not count.</text>
<rect class="tile" x="326.75" y="309" width="169.75" height="78.5" rx="8"/>
<text x="338.75" y="329" class="fg b" font-size="12.5">1 s for .catch</text>
<text x="338.75" y="345" class="muted" font-size="11">The handler&#x27;s grace, counted</text>
<text x="338.75" y="358.5" class="muted" font-size="11">from the moment it is</text>
<text x="338.75" y="372" class="muted" font-size="11">called.</text>
<rect class="tile" x="518.5" y="309" width="169.75" height="78.5" rx="8"/>
<text x="530.5" y="329" class="fg b" font-size="12.5">5 s to linger</text>
<text x="530.5" y="345" class="muted" font-size="11">After next.signal aborts.</text>
<text x="530.5" y="358.5" class="muted" font-size="11">Then the hook is reported as</text>
<text x="530.5" y="372" class="muted" font-size="11">lingering.</text>
<rect class="tile" x="710.25" y="309" width="169.75" height="78.5" rx="8"/>
<text x="722.25" y="329" class="fg b" font-size="12.5">30 s of $ calls</text>
<text x="722.25" y="345" class="muted" font-size="11">The cap for one ui.render or</text>
<text x="722.25" y="358.5" class="muted" font-size="11">tool.list hook, all its calls</text>
<text x="722.25" y="372" class="muted" font-size="11">together.</text>
<rect class="softbox" x="32" y="411.5" width="856" height="34" rx="8"/>
<text x="46" y="433" class="fg" font-size="12">A failing mod never takes the session down. The price is that a guard must say what happens when it fails.</text>
</svg>
