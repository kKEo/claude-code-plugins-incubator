<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 418" width="920" height="418" role="img" aria-labelledby="t d">
<title id="t">The hook chain: an event passes through five tiers and back</title>
<desc id="d">The engine raises an event. Its input travels inward through the tiers prepend, user, append, builtin and core, each link calling next. The result travels back out the same way. Mods you install sit in the user tier.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.hot{fill:var(--soft);stroke:var(--accent)}.softbox{fill:var(--soft);stroke:none}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.arrowa{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:4 4}.ah{fill:var(--faint)}.aha{fill:var(--accent)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.dot{fill:var(--accent)}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1L9 5L0 9z"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 1L9 5L0 9z"/></marker></defs>
<rect class="panel" x=".5" y=".5" width="919" height="417" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">the hook chain</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">ONE EVENT, ONE DISPATCH</tspan><tspan dx="10">outermost first</tspan></text>
<text x="32" y="100" class="muted" font-size="12">e, the input, travels inward: each link calls next(e)</text>
<path class="arrowa" d="M330 96L888 96" marker-end="url(#aha)"/>
<rect class="tile" x="32" y="116" width="121" height="96" rx="8"/>
<text x="42" y="136" class="fg b mono" font-size="12">engine</text>
<text x="42" y="152" class="muted" font-size="11">raises tool.call</text>
<path class="arrowa" d="M156 148L176 148" marker-end="url(#aha)"/>
<path class="arrow" d="M176 182L156 182" marker-end="url(#ah)"/>
<rect class="tile" x="179" y="116" width="121" height="96" rx="8"/>
<text x="189" y="136" class="fg b mono" font-size="12">prepend</text>
<text x="189" y="152" class="muted" font-size="11">mods an</text>
<text x="189" y="165.5" class="muted" font-size="11">organization puts</text>
<text x="189" y="179" class="muted" font-size="11">first</text>
<path class="arrowa" d="M303 148L323 148" marker-end="url(#aha)"/>
<path class="arrow" d="M323 182L303 182" marker-end="url(#ah)"/>
<rect class="hot" x="326" y="116" width="121" height="96" rx="8"/>
<text x="336" y="136" class="fg b mono" font-size="12">user</text>
<text x="336" y="152" class="muted" font-size="11">the mods you</text>
<text x="336" y="165.5" class="muted" font-size="11">install</text>
<path class="arrowa" d="M450 148L470 148" marker-end="url(#aha)"/>
<path class="arrow" d="M470 182L450 182" marker-end="url(#ah)"/>
<rect class="tile" x="473" y="116" width="121" height="96" rx="8"/>
<text x="483" y="136" class="fg b mono" font-size="12">append</text>
<text x="483" y="152" class="muted" font-size="11">mods an</text>
<text x="483" y="165.5" class="muted" font-size="11">organization puts</text>
<text x="483" y="179" class="muted" font-size="11">last</text>
<path class="arrowa" d="M597 148L617 148" marker-end="url(#aha)"/>
<path class="arrow" d="M617 182L597 182" marker-end="url(#ah)"/>
<rect class="tile" x="620" y="116" width="121" height="96" rx="8"/>
<text x="630" y="136" class="fg b mono" font-size="12">builtin</text>
<text x="630" y="152" class="muted" font-size="11">mods shipped in</text>
<text x="630" y="165.5" class="muted" font-size="11">the binary</text>
<path class="arrowa" d="M744 148L764 148" marker-end="url(#aha)"/>
<path class="arrow" d="M764 182L744 182" marker-end="url(#ah)"/>
<rect class="tile" x="767" y="116" width="121" height="96" rx="8"/>
<text x="777" y="136" class="fg b mono" font-size="12">core</text>
<text x="777" y="152" class="muted" font-size="11">the permission</text>
<text x="777" y="165.5" class="muted" font-size="11">prompt, then the</text>
<text x="777" y="179" class="muted" font-size="11">tool</text>
<text x="386.5" y="232" class="accent caps" font-size="9.5" text-anchor="middle">your mod</text>
<path class="arrow" d="M888 250L330 250" marker-end="url(#ah)"/>
<text x="32" y="254" class="muted" font-size="12">the result travels back out the same way</text>
<rect class="card" x="32" y="276" width="274.667" height="110" rx="10"/>
<text x="46" y="300" class="fg b" font-size="12.5">Outer means more authority</text>
<text x="46" y="320" class="muted" font-size="11.5">A link further out sees the call first and the</text>
<text x="46" y="335" class="muted" font-size="11.5">result last. It can refuse before yours ever</text>
<text x="46" y="350" class="muted" font-size="11.5">runs.</text>
<rect class="card" x="322.667" y="276" width="274.667" height="110" rx="10"/>
<text x="336.667" y="300" class="fg b" font-size="12.5">Your hook is one link</text>
<text x="336.667" y="320" class="muted" font-size="11.5">It receives e from the link above. next(e) runs</text>
<text x="336.667" y="335" class="muted" font-size="11.5">everything beneath it, down to core, and</text>
<text x="336.667" y="350" class="muted" font-size="11.5">resolves to the result.</text>
<rect class="card" x="613.333" y="276" width="274.667" height="110" rx="10"/>
<text x="627.333" y="300" class="fg b" font-size="12.5">Core does the real work</text>
<text x="627.333" y="320" class="muted" font-size="11.5">For tool.call that is the permission prompt and</text>
<text x="627.333" y="335" class="muted" font-size="11.5">the tool. For ui.render it is the engine&#x27;s own</text>
<text x="627.333" y="350" class="muted" font-size="11.5">drawing.</text>
</svg>
