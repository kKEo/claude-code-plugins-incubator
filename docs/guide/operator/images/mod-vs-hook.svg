<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 448" width="920" height="448" role="img" aria-labelledby="t d">
<title id="t">A command hook and a mod compared</title>
<desc id="d">A command hook: the engine reaches an event, starts your script as a new process with the event as JSON on stdin, and reads JSON from stdout; it cannot draw and remembers nothing. A mod: the engine loads your module once into a sandbox, its hooks join the chain of each event, and the hooks call back through the engine interface to draw, keep state, run processes and start timers.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.hot{fill:var(--soft);stroke:var(--accent)}.softbox{fill:var(--soft);stroke:none}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.arrowa{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:4 4}.ah{fill:var(--faint)}.aha{fill:var(--accent)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.dot{fill:var(--accent)}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1L9 5L0 9z"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 1L9 5L0 9z"/></marker></defs>
<rect class="panel" x=".5" y=".5" width="919" height="447" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">two kinds of hook</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">SAME FILE, DIFFERENT KEY</tspan><tspan dx="10">hooks/hooks.json</tspan></text>
<rect class="card" x="32" y="80" width="420" height="300" rx="10"/>
<text x="48" y="108" class="fg b" font-size="15">Command hook</text>
<text x="436" y="107" class="muted mono" font-size="10.5" text-anchor="end">&quot;hooks&quot;: { &quot;Stop&quot;: [ ... ] }</text>
<rect class="tile" x="48" y="124" width="388" height="60" rx="8"/>
<text x="60" y="144" class="fg b" font-size="12.5">The engine reaches an event</text>
<text x="60" y="160" class="muted" font-size="11">PreToolUse, PostToolUse, Stop, SessionStart and a few more.</text>
<path class="arrow" d="M242 187L242 205" marker-end="url(#ah)"/>
<rect class="tile" x="48" y="208" width="388" height="60" rx="8"/>
<text x="60" y="228" class="fg b" font-size="12.5">It starts your script</text>
<text x="60" y="244" class="muted" font-size="11">A new process every time. The event arrives as JSON on stdin.</text>
<path class="arrow" d="M242 271L242 289" marker-end="url(#ah)"/>
<rect class="tile" x="48" y="292" width="388" height="60" rx="8"/>
<text x="60" y="312" class="fg b" font-size="12.5">The script prints JSON and exits</text>
<text x="60" y="328" class="muted" font-size="11">It can add context or block. It cannot draw, and it remembers nothing.</text>
<rect class="card" x="468" y="80" width="420" height="300" rx="10"/>
<text x="484" y="108" class="fg b" font-size="15">Mod</text>
<text x="872" y="107" class="accent mono" font-size="10.5" text-anchor="end">&quot;modules&quot;: [&quot;./register.tsx&quot;]</text>
<rect class="tile" x="484" y="124" width="388" height="60" rx="8"/>
<text x="496" y="144" class="fg b" font-size="12.5">The engine loads your module once</text>
<text x="496" y="160" class="muted" font-size="11">Into a sandbox of its own: no DOM, no Node, no network of its own.</text>
<path class="arrow" d="M678 187L678 205" marker-end="url(#ah)"/>
<rect class="tile" x="484" y="208" width="388" height="60" rx="8"/>
<text x="496" y="228" class="fg b" font-size="12.5">Your hooks join the chain of each event</text>
<text x="496" y="244" class="muted" font-size="11">Fifty-odd events, with both the input and the result in reach.</text>
<path class="arrow" d="M678 271L678 289" marker-end="url(#ah)"/>
<rect class="hot" x="484" y="292" width="388" height="60" rx="8"/>
<text x="496" y="312" class="fg b" font-size="12.5">A hook calls back through $</text>
<text x="496" y="328" class="muted" font-size="11">Draw, keep state, run a process, ask a model, start a timer.</text>
<rect class="softbox" x="32" y="396" width="856" height="34" rx="8"/>
<text x="46" y="417.5" class="fg" font-size="12">One plugin can ship both kinds, but one hooks.json holds one of them: a hooks key for commands, or a modules key for a mod.</text>
</svg>
