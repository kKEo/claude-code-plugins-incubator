<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" role="img" aria-labelledby="t d">
<title id="t">The files of a mod and what the engine does with each</title>
<desc id="d">plugin.json is the manifest. hooks/hooks.json names the one hooks module. hooks/register.tsx exports register(on, options) and adds the hooks. types/index.d.ts is the state contract. hooks/*.test.ts are tests run by claude plugin test.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.hot{fill:var(--soft);stroke:var(--accent)}.softbox{fill:var(--soft);stroke:none}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.arrowa{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:4 4}.ah{fill:var(--faint)}.aha{fill:var(--accent)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.dot{fill:var(--accent)}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1L9 5L0 9z"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 1L9 5L0 9z"/></marker></defs>
<rect class="panel" x=".5" y=".5" width="919" height="519" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">anatomy of a mod</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">FIVE FILES, THREE REQUIRED</tspan><tspan dx="10">no build step</tspan></text>
<rect class="card" x="32" y="80" width="856" height="374" rx="10"/>
<rect class="tile" x="48" y="96" width="262" height="58" rx="8"/>
<text x="60" y="121" class="fg b mono" font-size="12">.claude-plugin/plugin.json</text>
<text x="60" y="139" class="faint caps" font-size="9">required</text>
<path class="arrow" d="M313 125L337 125" marker-end="url(#ah)"/>
<rect class="tile" x="340" y="96" width="532" height="58" rx="8"/>
<text x="352" y="116" class="fg b" font-size="12.5">The manifest</text>
<text x="352" y="132" class="muted" font-size="11">name, version and description. types names the state contract. userConfig declares the /config</text>
<text x="352" y="145.5" class="muted" font-size="11">options.</text>
<rect class="tile" x="48" y="166" width="262" height="58" rx="8"/>
<text x="60" y="191" class="fg b mono" font-size="12">hooks/hooks.json</text>
<text x="60" y="209" class="faint caps" font-size="9">required</text>
<path class="arrow" d="M313 195L337 195" marker-end="url(#ah)"/>
<rect class="tile" x="340" y="166" width="532" height="58" rx="8"/>
<text x="352" y="186" class="fg b" font-size="12.5">The pointer</text>
<text x="352" y="202" class="muted" font-size="11">One line: { &quot;modules&quot;: [&quot;./register.tsx&quot;] }. One path, relative to this file.</text>
<rect class="tile" x="48" y="236" width="262" height="58" rx="8"/>
<text x="60" y="261" class="fg b mono" font-size="12">hooks/register.tsx</text>
<text x="60" y="279" class="faint caps" font-size="9">required</text>
<path class="arrow" d="M313 265L337 265" marker-end="url(#ah)"/>
<rect class="hot" x="340" y="236" width="532" height="58" rx="8"/>
<text x="352" y="256" class="fg b" font-size="12.5">The hooks module</text>
<text x="352" y="272" class="muted" font-size="11">Exports register(on, options). Each on(event, matcher?, hook) adds one hook to that event&#x27;s chain.</text>
<rect class="tile" x="48" y="306" width="262" height="58" rx="8"/>
<text x="60" y="331" class="fg b mono" font-size="12">types/index.d.ts</text>
<text x="60" y="349" class="faint caps" font-size="9">when it keeps state</text>
<path class="arrow" d="M313 335L337 335" marker-end="url(#ah)"/>
<rect class="tile" x="340" y="306" width="532" height="58" rx="8"/>
<text x="352" y="326" class="fg b" font-size="12.5">The state contract</text>
<text x="352" y="342" class="muted" font-size="11">Declares every value the mod keeps in $.state. The validator holds the module to it.</text>
<rect class="tile" x="48" y="376" width="262" height="58" rx="8"/>
<text x="60" y="401" class="fg b mono" font-size="12">hooks/*.test.ts</text>
<text x="60" y="419" class="faint caps" font-size="9">optional</text>
<path class="arrow" d="M313 405L337 405" marker-end="url(#ah)"/>
<rect class="tile" x="340" y="376" width="532" height="58" rx="8"/>
<text x="352" y="396" class="fg b" font-size="12.5">Tests</text>
<text x="352" y="412" class="muted" font-size="11">Run against the real engine by claude plugin test, on each surface the test names.</text>
<rect class="softbox" x="32" y="470" width="856" height="34" rx="8"/>
<text x="46" y="491.5" class="fg" font-size="12">Beside a mod it hot-reloads, the engine writes .claude-plugin/types/: the API declarations your editor and tsc read.</text>
</svg>
