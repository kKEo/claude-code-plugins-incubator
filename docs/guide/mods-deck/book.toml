[book]
title = "Claude Code mods: a slide deck"
description = "An introduction to Claude Code mods for experienced engineers, one slide per page, told in diagrams and ending with the mods of this marketplace."
authors = ["Krzysztof Maziarz"]
language = "en"
src = "src"

[build]
build-dir = "../../../site/mods-deck"
create-missing = false

[output.html]
site-url = "/claude-code-plugins-incubator/mods-deck/"
git-repository-url = "https://github.com/kKEo/claude-code-plugins-incubator"
no-section-label = true
additional-css = ["slides.css"]
additional-js = ["slides.js"]
