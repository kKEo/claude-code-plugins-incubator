<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480" role="img" aria-labelledby="t d">
<title id="t">The engine interface, grouped by what it reaches</title>
<desc id="d">Every hook receives the engine interface, written as a dollar sign. Its nouns fall into six groups. Draw: ui, theme, audio. Remember: state and store. Time: clock. Reach outside: fs, process, http, mcp, env. The model and the session: model, prompt, session, agent. Extend: tool and command. Every call is itself an event, so an outer mod can refuse it and a test can answer it.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.hot{fill:var(--soft);stroke:var(--accent)}.softbox{fill:var(--soft);stroke:none}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.arrowa{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:4 4}.ah{fill:var(--faint)}.aha{fill:var(--accent)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.dot{fill:var(--accent)}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1L9 5L0 9z"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 1L9 5L0 9z"/></marker></defs>
<rect class="panel" x=".5" y=".5" width="919" height="479" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">the engine interface</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">ALWAYS NOUN, THEN METHOD</tspan><tspan dx="10">$.ui.status, $.fs.read, $.clock.every</tspan></text>
<rect class="card" x="32" y="80" width="276" height="138" rx="10"/>
<text x="48" y="108" class="fg b" font-size="16">Draw</text>
<text x="292" y="107" class="faint caps" font-size="9.5" text-anchor="end">THE INTERFACE</text>
<rect class="softbox" x="48" y="124" width="52" height="28" rx="6"/>
<text x="60" y="142.68" class="fg mono" font-size="13">$.ui</text>
<rect class="softbox" x="108" y="124" width="77" height="28" rx="6"/>
<text x="120" y="142.68" class="fg mono" font-size="13">$.theme</text>
<rect class="softbox" x="193" y="124" width="77" height="28" rx="6"/>
<text x="205" y="142.68" class="fg mono" font-size="13">$.audio</text>
<text x="48" y="178.0" class="muted" font-size="13">status, toast, open, resolve,</text>
<text x="48" y="195.9" class="muted" font-size="13">invalidate, notify, log</text>
<rect class="card" x="322" y="80" width="276" height="138" rx="10"/>
<text x="338" y="108" class="fg b" font-size="16">Remember</text>
<text x="582" y="107" class="faint caps" font-size="9.5" text-anchor="end">VALUES</text>
<rect class="softbox" x="338" y="124" width="77" height="28" rx="6"/>
<text x="350" y="142.68" class="fg mono" font-size="13">$.state</text>
<rect class="softbox" x="423" y="124" width="77" height="28" rx="6"/>
<text x="435" y="142.68" class="fg mono" font-size="13">$.store</text>
<text x="338" y="178.0" class="muted" font-size="13">for the session, reactive;</text>
<text x="338" y="195.9" class="muted" font-size="13">across sessions, 4 MiB of JSON</text>
<rect class="card" x="612" y="80" width="276" height="138" rx="10"/>
<text x="628" y="108" class="fg b" font-size="16">Time</text>
<text x="872" y="107" class="faint caps" font-size="9.5" text-anchor="end">WORK WITH NO EVENT</text>
<rect class="softbox" x="628" y="124" width="77" height="28" rx="6"/>
<text x="640" y="142.68" class="fg mono" font-size="13">$.clock</text>
<text x="628" y="178.0" class="muted" font-size="13">now, every, after, sleep;</text>
<text x="628" y="195.9" class="muted" font-size="13">timers stop at a reload</text>
<rect class="card" x="32" y="296" width="276" height="138" rx="10"/>
<text x="48" y="324" class="fg b" font-size="16">Reach outside</text>
<text x="292" y="323" class="faint caps" font-size="9.5" text-anchor="end">THE MACHINE</text>
<rect class="softbox" x="48" y="340" width="52" height="28" rx="6"/>
<text x="60" y="358.68" class="fg mono" font-size="13">$.fs</text>
<rect class="softbox" x="108" y="340" width="93" height="28" rx="6"/>
<text x="120" y="358.68" class="fg mono" font-size="13">$.process</text>
<rect class="softbox" x="209" y="340" width="69" height="28" rx="6"/>
<text x="221" y="358.68" class="fg mono" font-size="13">$.http</text>
<text x="48" y="394.0" class="muted" font-size="13">files, host commands with no</text>
<text x="48" y="411.9" class="muted" font-size="13">shell, fetch; also $.mcp, $.env</text>
<rect class="card" x="322" y="296" width="276" height="138" rx="10"/>
<text x="338" y="324" class="fg b" font-size="16">The model</text>
<text x="582" y="323" class="faint caps" font-size="9.5" text-anchor="end">AND THE SESSION</text>
<rect class="softbox" x="338" y="340" width="77" height="28" rx="6"/>
<text x="350" y="358.68" class="fg mono" font-size="13">$.model</text>
<rect class="softbox" x="423" y="340" width="85" height="28" rx="6"/>
<text x="435" y="358.68" class="fg mono" font-size="13">$.prompt</text>
<rect class="softbox" x="516" y="340" width="93" height="28" rx="6"/>
<text x="528" y="358.68" class="fg mono" font-size="13">$.session</text>
<text x="338" y="394.0" class="muted" font-size="13">complete, fork; submit a prompt;</text>
<text x="338" y="411.9" class="muted" font-size="13">read messages; $.agent</text>
<rect class="card" x="612" y="296" width="276" height="138" rx="10"/>
<text x="628" y="324" class="fg b" font-size="16">Extend</text>
<text x="872" y="323" class="faint caps" font-size="9.5" text-anchor="end">NEW ENTRY POINTS</text>
<rect class="softbox" x="628" y="340" width="69" height="28" rx="6"/>
<text x="640" y="358.68" class="fg mono" font-size="13">$.tool</text>
<rect class="softbox" x="705" y="340" width="93" height="28" rx="6"/>
<text x="717" y="358.68" class="fg mono" font-size="13">$.command</text>
<text x="628" y="394.0" class="muted" font-size="13">a tool the model can call,</text>
<text x="628" y="411.9" class="muted" font-size="13">a slash command you type</text>
<rect class="hot" x="32" y="232" width="856" height="50" rx="10"/>
<text x="60" y="264" class="accent b mono" font-size="22">$</text>
<text x="92" y="263" class="fg sb" font-size="14">Every call on $ is itself an event: $.fs.write raises fs.write.</text>
<text x="872" y="263" class="muted" font-size="13" text-anchor="end">An outer mod can refuse it. A test can answer it.</text>
<text x="460" y="458" class="muted" font-size="12.5" text-anchor="middle">The exact, complete reference is the declaration file the engine writes beside your mod: .claude-plugin/types/claude-code/index.d.ts</text>
</svg>
