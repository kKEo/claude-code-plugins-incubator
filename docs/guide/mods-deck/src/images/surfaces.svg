<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920" height="340" role="img" aria-labelledby="t d">
<title id="t">Where a mod runs and where it draws</title>
<desc id="d">In the terminal, in the Code tab of the desktop app and in the VS Code extension, hooks run and the mod draws. In headless runs with claude -p and in the Agent SDK, hooks run but nothing is drawn. In a desktop session inside WSL, hooks do not run.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.hot{fill:var(--soft);stroke:var(--accent)}.softbox{fill:var(--soft);stroke:none}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.arrowa{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:4 4}.ah{fill:var(--faint)}.aha{fill:var(--accent)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.dot{fill:var(--accent)}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1L9 5L0 9z"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 1L9 5L0 9z"/></marker></defs>
<rect class="panel" x=".5" y=".5" width="919" height="339" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">where a mod runs</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">ONE MOD, SEVERAL SURFACES</tspan><tspan dx="10">e.surface says which one is drawing</tspan></text>
<rect class="hot" x="32" y="80" width="540" height="180" rx="10"/>
<text x="48" y="108" class="fg b" font-size="16">Hooks run, and the mod draws</text>
<text x="556" y="107" class="accent caps" font-size="9.5" text-anchor="end">INTERACTIVE</text>
<rect class="tile" x="48" y="128" width="164" height="108" rx="8"/>
<text x="130" y="172" class="fg b" font-size="15" text-anchor="middle">Terminal</text>
<text x="130" y="196" class="muted" font-size="13" text-anchor="middle">the CLI</text>
<rect class="tile" x="220" y="128" width="164" height="108" rx="8"/>
<text x="302" y="172" class="fg b" font-size="15" text-anchor="middle">Desktop app</text>
<text x="302" y="196" class="muted" font-size="13" text-anchor="middle">the Code tab</text>
<rect class="tile" x="392" y="128" width="164" height="108" rx="8"/>
<text x="474" y="172" class="fg b" font-size="15" text-anchor="middle">VS Code</text>
<text x="474" y="196" class="muted" font-size="13" text-anchor="middle">the extension</text>
<rect class="card" x="596" y="80" width="292" height="180" rx="10"/>
<text x="612" y="108" class="fg b" font-size="16">Hooks run, nothing draws</text>
<rect class="tile" x="612" y="128" width="126" height="108" rx="8" stroke-dasharray="4 4"/>
<text x="675" y="172" class="fg mono sb" font-size="13.5" text-anchor="middle">claude -p</text>
<text x="675" y="196" class="muted" font-size="13" text-anchor="middle">headless runs</text>
<rect class="tile" x="746" y="128" width="126" height="108" rx="8" stroke-dasharray="4 4"/>
<text x="809" y="172" class="fg mono sb" font-size="13.5" text-anchor="middle">Agent SDK</text>
<text x="809" y="196" class="muted" font-size="13" text-anchor="middle">your own agent</text>
<rect class="softbox" x="32" y="278" width="856" height="36" rx="8"/>
<text x="460" y="301" class="fg" font-size="13.5" text-anchor="middle">A tool guard still guards in CI. A pane simply is not placed. Desktop sessions inside WSL run no hooks.</text>
</svg>
