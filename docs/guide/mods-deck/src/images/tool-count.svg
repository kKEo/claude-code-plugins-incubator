<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" role="img" aria-labelledby="t d">
<title id="t">How the tool-count mod works</title>
<desc id="d">Claude is about to run a tool, so the engine raises tool.call. Your hook adds one to a counter, pins the count under the prompt with the status call, and returns next of e, so the tool runs exactly as it would have.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.hot{fill:var(--soft);stroke:var(--accent)}.softbox{fill:var(--soft);stroke:none}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.arrowa{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:4 4}.ah{fill:var(--faint)}.aha{fill:var(--accent)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.dot{fill:var(--accent)}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1L9 5L0 9z"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 1L9 5L0 9z"/></marker></defs>
<rect class="panel" x=".5" y=".5" width="919" height="299" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">tool-count</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">THE PASS MOVE</tspan><tspan dx="10">watch, never interfere</tspan></text>
<rect class="tile" x="32" y="96" width="190" height="84" rx="10"/>
<text x="127" y="130" class="fg sb" font-size="14" text-anchor="middle">Claude calls a tool</text>
<text x="127" y="152" class="muted mono" font-size="12.5" text-anchor="middle">tool.call</text>
<rect class="hot" x="266" y="80" width="388" height="116" rx="10"/>
<text x="282" y="106" class="fg b" font-size="15">your hook</text>
<text x="638" y="105" class="accent mono" font-size="12" text-anchor="end">($, e, next)</text>
<text x="282" y="132" class="fg mono" font-size="13">calls += 1</text>
<text x="282" y="152" class="fg mono" font-size="13">$.ui.status(`${calls} tool calls`)</text>
<text x="282" y="172" class="fg mono" font-size="13">return next(e)</text>
<rect class="tile" x="698" y="96" width="190" height="84" rx="10"/>
<text x="793" y="130" class="fg sb" font-size="14" text-anchor="middle">The tool runs</text>
<text x="793" y="152" class="muted" font-size="12.5" text-anchor="middle">unchanged</text>
<path class="arrow" d="M225 138L263 138" marker-end="url(#ah)"/>
<path class="arrow" d="M657 138L695 138" marker-end="url(#ah)"/>
<rect class="card" x="266" y="222" width="388" height="58" rx="10"/>
<text x="282" y="246" class="faint mono" font-size="14">&gt;</text>
<text x="300" y="246" class="muted" font-size="13">list the files in src/</text>
<text x="282" y="268" class="accent mono sb" font-size="12.5">3 tool calls</text>
<text x="638" y="268" class="faint caps" font-size="9" text-anchor="end">STATUS LINE</text>
<path class="arrowa" d="M460 198L460 219" marker-end="url(#aha)"/>
</svg>
