<title id="t">The four parts of this deck</title>
<desc id="d">Part one, what a mod is. Part two, how it works: the hook chain, events, the engine interface, drawing and state. Part three, building one: write, validate, load, test. Part four, examples, from ten lines to the four mods of this repository.</desc>
