<text x="574" y="232" class="faint mono" font-size="12" text-anchor="end">57</text>
<text x="346" y="252" class="muted" font-size="12.5">a timer, a process, a notification</text>
<rect class="tile" x="334" y="278" width="252" height="58" rx="8"/>
<text x="346" y="302" class="fg mono sb" font-size="13.5">turn-meter</text>
<text x="574" y="302" class="faint mono" font-size="12" text-anchor="end">64</text>
<text x="346" y="322" class="muted" font-size="12.5">state, and a band with a button</text>
<rect class="tile" x="334" y="348" width="252" height="58" rx="8"/>
<text x="346" y="372" class="fg mono sb" font-size="13.5">decision-log</text>
<text x="574" y="372" class="faint mono" font-size="12" text-anchor="end">79</text>
<text x="346" y="392" class="muted" font-size="12.5">a tool, a command, a pane, the store</text>
<path class="arrow" d="M601 400L609 400" marker-end="url(#ah)"/>
<rect class="hot" x="612" y="94" width="276" height="336" rx="10"/>
<text x="628" y="122" class="fg b" font-size="16">This repo</text>
<text x="872" y="121" class="accent caps" font-size="9" text-anchor="end">INSTALLABLE</text>
<rect class="tile" x="624" y="138" width="252" height="58" rx="8"/>
<text x="636" y="162" class="fg mono sb" font-size="13.5">instances-monitor</text>
<text x="864" y="162" class="faint mono" font-size="12" text-anchor="end">123</text>
<text x="636" y="182" class="muted" font-size="12.5">a timer, ps and a pane</text>
<rect class="tile" x="624" y="208" width="252" height="58" rx="8"/>
<text x="636" y="232" class="fg mono sb" font-size="13.5">prompt-coach</text>
<text x="864" y="232" class="faint mono" font-size="12" text-anchor="end">544</text>
<text x="636" y="252" class="muted" font-size="12.5">prompts, a model call, the store</text>
<rect class="tile" x="624" y="278" width="252" height="58" rx="8"/>
<text x="636" y="302" class="fg mono sb" font-size="13.5">plan-progress</text>
<text x="864" y="302" class="faint mono" font-size="12" text-anchor="end">656</text>
<text x="636" y="322" class="muted" font-size="12.5">seven tool hooks and its own tool</text>
<rect class="tile" x="624" y="348" width="252" height="58" rx="8"/>
<text x="636" y="372" class="fg mono sb" font-size="13.5">session-cost</text>
<text x="864" y="372" class="faint mono" font-size="12" text-anchor="end">1576</text>
<text x="636" y="392" class="muted" font-size="12.5">a stream, a band, a pane, history</text>
<text x="170" y="110" class="muted" font-size="14" text-anchor="middle">Start here.</text>
<text x="170" y="132" class="muted" font-size="13" text-anchor="middle">Each example can be typed</text>
<text x="170" y="150" class="muted" font-size="13" text-anchor="middle">and run as shown.</text>
