<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="920" height="460" role="img" aria-labelledby="t d">
<title id="t">A mod in one picture</title>
<desc id="d">The Claude Code engine raises events such as tool.call, prompt.submit, turn.step and ui.render. Your hooks module, loaded once per session, has hooks in the chain of those events. Through the engine interface, written as a dollar sign, a hook draws in the interface, keeps values, and reaches files, processes, the network and the model.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.hot{fill:var(--soft);stroke:var(--accent)}.softbox{fill:var(--soft);stroke:none}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.arrowa{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:4 4}.ah{fill:var(--faint)}.aha{fill:var(--accent)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.dot{fill:var(--accent)}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1L9 5L0 9z"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 1L9 5L0 9z"/></marker></defs>
<rect class="panel" x=".5" y=".5" width="919" height="459" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">a mod, in one picture</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">LOADED INTO THE SESSION</tspan><tspan dx="10">your code in the path of engine events</tspan></text>
<rect class="card" x="32" y="80" width="250" height="290" rx="10"/>
<text x="48" y="108" class="fg b" font-size="16">The engine</text>
<text x="266" y="107" class="faint caps" font-size="9.5" text-anchor="end">RAISES EVENTS</text>
<rect class="tile" x="48" y="124" width="218" height="46" rx="8"/>
<text x="60" y="144" class="fg mono sb" font-size="13.5">tool.call</text>
<text x="60" y="161" class="muted" font-size="12">a tool is about to run</text>
<rect class="tile" x="48" y="182" width="218" height="46" rx="8"/>
<text x="60" y="202" class="fg mono sb" font-size="13.5">prompt.submit</text>
<text x="60" y="219" class="muted" font-size="12">a prompt is sent</text>
<rect class="tile" x="48" y="240" width="218" height="46" rx="8"/>
<text x="60" y="260" class="fg mono sb" font-size="13.5">turn.step</text>
<text x="60" y="277" class="muted" font-size="12">one model request</text>
<rect class="tile" x="48" y="298" width="218" height="46" rx="8"/>
<text x="60" y="318" class="fg mono sb" font-size="13.5">ui.render</text>
<text x="60" y="335" class="muted" font-size="12">something needs drawing</text>
<rect class="hot" x="326" y="80" width="268" height="290" rx="10"/>
<text x="342" y="108" class="fg b" font-size="16">Your hooks module</text>
<text x="578" y="107" class="accent caps" font-size="9.5" text-anchor="end">THE MOD</text>
<text x="342" y="136.0" class="muted" font-size="13">One TypeScript or JavaScript file,</text>
<text x="342" y="153.9" class="muted" font-size="13">loaded once per session.</text>
<rect class="tile" x="342" y="176" width="236" height="112" rx="8"/>
<text x="354" y="200.0" class="fg mono" font-size="12.5">on(&#x27;tool.call&#x27;,</text>
<text x="354" y="218.5" class="fg mono" font-size="12.5" xml:space="preserve">  ($, e, next) =&gt; {</text>
<text x="354" y="237.0" class="fg mono" font-size="12.5" xml:space="preserve">    // watch, change, answer</text>
<text x="354" y="255.5" class="fg mono" font-size="12.5" xml:space="preserve">    return next(e)</text>
<text x="354" y="274.0" class="fg mono" font-size="12.5">})</text>
<text x="342" y="316" class="muted mono" font-size="12" xml:space="preserve">$      the engine interface</text>
<text x="342" y="334" class="muted mono" font-size="12" xml:space="preserve">e      the event’s input</text>
<text x="342" y="352" class="muted mono" font-size="12" xml:space="preserve">next   the rest of the chain</text>
<path class="arrow" d="M285 190L323 190" marker-end="url(#ah)"/>
<text x="304" y="180" class="faint" font-size="11" text-anchor="middle">event</text>
<path class="arrowa" d="M323 250L285 250" marker-end="url(#aha)"/>
<text x="304" y="270" class="accent" font-size="11" text-anchor="middle">result</text>
<rect class="card" x="638" y="80" width="250" height="290" rx="10"/>
<text x="654" y="108" class="fg b" font-size="16">Through $</text>
<text x="872" y="107" class="faint caps" font-size="9.5" text-anchor="end">A HOOK CAN</text>
<rect class="tile" x="654" y="124" width="218" height="46" rx="8"/>
<text x="666" y="144" class="fg sb" font-size="13.5">Draw</text>
<text x="666" y="161" class="muted" font-size="12">pane, band, status line, toast</text>
<rect class="tile" x="654" y="182" width="218" height="46" rx="8"/>
<text x="666" y="202" class="fg sb" font-size="13.5">Remember</text>
<text x="666" y="219" class="muted" font-size="12">$.state, $.store</text>
<rect class="tile" x="654" y="240" width="218" height="46" rx="8"/>
<text x="666" y="260" class="fg sb" font-size="13.5">Reach outside</text>
<text x="666" y="277" class="muted" font-size="12">files, processes, network</text>
<rect class="tile" x="654" y="298" width="218" height="46" rx="8"/>
<text x="666" y="318" class="fg sb" font-size="13.5">Ask a model</text>
<text x="666" y="335" class="muted" font-size="12">$.model.complete</text>
<path class="arrowa" d="M597 220L635 220" marker-end="url(#aha)"/>
<rect class="softbox" x="32" y="390" width="856" height="40" rx="8"/>
<text x="460" y="415" class="fg" font-size="13.5" text-anchor="middle">No build step, no node_modules, no Node APIs: the engine compiles the module and everything outside goes through $.</text>
</svg>
