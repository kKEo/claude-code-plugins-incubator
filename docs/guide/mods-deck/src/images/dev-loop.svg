<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-labelledby="t d">
<title id="t">The development loop of a mod</title>
<desc id="d">One: write three files, plugin.json, hooks.json and the hooks module. Two: claude plugin validate type-checks them and prints what the module hooks and calls. Three: claude --plugin-dir loads the mod for one session. Four: edit and save, and the session reloads the module by itself; repeat. Five: claude plugin test runs the tests. Then share it through a marketplace. Or ask Claude to make the mod: the plugin-authoring skill writes the files and asks once before turning them on.</desc>
<style>:root{--bg:#ffffff;--card:#f6f7f9;--line:#dfe3e8;--fg:#1b2130;--muted:#566074;--faint:#8b94a5;--accent:#2f5bd6;--soft:#eaf0ff}@media (prefers-color-scheme:dark){:root{--bg:#161a22;--card:#1d222c;--line:#2f3644;--fg:#e7eaf0;--muted:#a3acbc;--faint:#737d90;--accent:#86a8ff;--soft:#222c45}}text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.panel{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.tile{fill:var(--bg);stroke:var(--line)}.hot{fill:var(--soft);stroke:var(--accent)}.softbox{fill:var(--soft);stroke:none}.rule{stroke:var(--line);fill:none}.ic{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.arrowa{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:4 4}.ah{fill:var(--faint)}.aha{fill:var(--accent)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.accent{fill:var(--accent)}.onaccent{fill:var(--bg)}.dot{fill:var(--accent)}.b{font-weight:700}.sb{font-weight:600}.caps{font-weight:700;letter-spacing:1.3px}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 1L9 5L0 9z"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 1L9 5L0 9z"/></marker></defs>
<rect class="panel" x=".5" y=".5" width="919" height="419" rx="14"/>
<rect class="tile" x="32" y="20" width="36" height="36" rx="8"/>
<g transform="translate(38 26)"><path class="ic" d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/></g>
<text x="82" y="44" class="fg b mono" font-size="17">the development loop</text>
<text x="888" y="43" text-anchor="end" font-size="12" class="muted"><tspan class="faint caps" font-size="10">TEN MINUTES TO A WORKING MOD</tspan><tspan dx="10">no build step anywhere</tspan></text>
<rect class="card" x="32" y="80" width="152" height="186" rx="10"/>
<circle class="dot" cx="58" cy="106" r="12"/>
<text x="58" y="110.5" class="onaccent b" font-size="12.5" text-anchor="middle">1</text>
<text x="80" y="111" class="fg b" font-size="15.5">Write</text>
<rect class="tile" x="40" y="128" width="136" height="79" rx="8"/>
<text x="49" y="149" class="fg mono" font-size="11">plugin.json</text>
<text x="49" y="168" class="fg mono" font-size="11">hooks/hooks.json</text>
<text x="49" y="187" class="fg mono" font-size="11">hooks/register.ts</text>
<text x="46" y="226.0" class="muted" font-size="12.5">three files</text>
<path class="arrow" d="M187 173L205 173" marker-end="url(#ah)"/>
<rect class="card" x="208" y="80" width="152" height="186" rx="10"/>
<circle class="dot" cx="234" cy="106" r="12"/>
<text x="234" y="110.5" class="onaccent b" font-size="12.5" text-anchor="middle">2</text>
<text x="256" y="111" class="fg b" font-size="15.5">Validate</text>
<rect class="tile" x="216" y="128" width="136" height="60" rx="8"/>
<text x="225" y="149" class="fg mono" font-size="11">claude plugin</text>
<text x="225" y="168" class="fg mono" font-size="11">validate &lt;dir&gt;</text>
<text x="222" y="226.0" class="muted" font-size="12.5">type-checks; prints</text>
<text x="222" y="243.2" class="muted" font-size="12.5">hooks: and calls:</text>
<path class="arrow" d="M363 173L381 173" marker-end="url(#ah)"/>
<rect class="card" x="384" y="80" width="152" height="186" rx="10"/>
<circle class="dot" cx="410" cy="106" r="12"/>
<text x="410" y="110.5" class="onaccent b" font-size="12.5" text-anchor="middle">3</text>
<text x="432" y="111" class="fg b" font-size="15.5">Load</text>
<rect class="tile" x="392" y="128" width="136" height="60" rx="8"/>
<text x="401" y="149" class="fg mono" font-size="11">claude</text>
<text x="401" y="168" class="fg mono" font-size="11">--plugin-dir &lt;dir&gt;</text>
<text x="398" y="226.0" class="muted" font-size="12.5">for this session only</text>
<path class="arrow" d="M539 173L557 173" marker-end="url(#ah)"/>
<rect class="hot" x="560" y="80" width="152" height="186" rx="10"/>
<circle class="dot" cx="586" cy="106" r="12"/>
<text x="586" y="110.5" class="onaccent b" font-size="12.5" text-anchor="middle">4</text>
<text x="608" y="111" class="fg b" font-size="15.5">Edit, save</text>
<rect class="tile" x="568" y="128" width="136" height="60" rx="8"/>
<text x="577" y="149" class="fg" font-size="12.5">the module</text>
<text x="577" y="168" class="fg" font-size="12.5">reloads by itself</text>
<text x="574" y="226.0" class="muted" font-size="12.5">state stays,</text>
<text x="574" y="243.2" class="muted" font-size="12.5">variables reset</text>
<path class="arrow" d="M715 173L733 173" marker-end="url(#ah)"/>
<rect class="card" x="736" y="80" width="152" height="186" rx="10"/>
<circle class="dot" cx="762" cy="106" r="12"/>
<text x="762" y="110.5" class="onaccent b" font-size="12.5" text-anchor="middle">5</text>
<text x="784" y="111" class="fg b" font-size="15.5">Test</text>
<rect class="tile" x="744" y="128" width="136" height="60" rx="8"/>
<text x="753" y="149" class="fg mono" font-size="11">claude plugin</text>
<text x="753" y="168" class="fg mono" font-size="11">test &lt;dir&gt;</text>
<text x="750" y="226.0" class="muted" font-size="12.5">against the real</text>
<text x="750" y="243.2" class="muted" font-size="12.5">engine</text>
<path class="arrowa" d="M812 269C812 300 636 300 636 271" marker-end="url(#aha)"/>
<text x="724" y="313" class="accent" font-size="12" text-anchor="middle">repeat until it is right</text>
<rect class="tile" x="32" y="334" width="416" height="56" rx="10"/>
<text x="48" y="358" class="fg b" font-size="14">Then share it</text>
<text x="48" y="378" class="muted" font-size="12.5" xml:space="preserve">a marketplace entry, then  /plugin install &lt;mod&gt;@&lt;marketplace&gt;</text>
<rect class="tile" x="472" y="334" width="416" height="56" rx="10"/>
<text x="488" y="358" class="fg b" font-size="14">Or ask Claude</text>
<text x="488" y="378" class="muted" font-size="12.5">“make a mod that …” loads the plugin-authoring skill</text>
</svg>
