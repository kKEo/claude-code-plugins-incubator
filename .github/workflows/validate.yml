name: Validate Marketplace

on:
  pull_request:
    paths:
      - 'marketplace.json'
  push:
    branches:
      - main
    paths:
      - 'marketplace.json'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Validate marketplace.json
        run: |
          jq empty marketplace.json
          echo "✅ marketplace.json is valid JSON"

      - name: Check required fields
        run: |
          # Check that each plugin has required fields
          jq -r '.plugins[] |
            if .id and .name and .description and .author and .version and .repository and .category and .license and .install then
              "✅ \(.id) has all required fields"
            else
              "❌ \(.id // "unknown") is missing required fields" | halt_error
            end' marketplace.json
