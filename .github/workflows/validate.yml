name: Validate Marketplace

on:
  pull_request:
    paths:
      - '.claude-plugin/marketplace.json'
  push:
    branches:
      - main
    paths:
      - '.claude-plugin/marketplace.json'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Validate marketplace.json
        run: |
          jq empty .claude-plugin/marketplace.json
          echo "✅ marketplace.json is valid JSON"

      - name: Check required fields
        run: |
          # Check that each plugin has required fields
          jq -r '.plugins[] |
            if .name and .description and .source and .category then
              "✅ \(.name) has all required fields"
            else
              "❌ \(.name // "unknown") is missing required fields" | halt_error
            end' .claude-plugin/marketplace.json
