name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/docs-check'
      - 'Makefile'
      - '.github/workflows/docs.yml'
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'scripts/docs-check'
      - 'Makefile'
      - '.github/workflows/docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

env:
  MDBOOK_VERSION: v0.4.40
  MDBOOK_SHA256: 9ef07fd288ba58ff3b99d1c94e6d414d431c9a61fdb20348e5beb74b823d546b

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Docs check (template validator + reconciliation)
        run: scripts/docs-check

      - name: Install mdBook (pinned, checksum verified)
        run: |
          url="https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL -o mdbook.tar.gz "$url"
          echo "${MDBOOK_SHA256}  mdbook.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf mdbook.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the three books
        run: make docs-build

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: check-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
