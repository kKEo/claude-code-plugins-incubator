[book]
title = "pingboard User Guide"
description = "Install pingboard, add URLs and read the dashboard."
authors = ["The pingboard contributors"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/example/pingboard"
edit-url-template = "https://github.com/example/pingboard/edit/main/docs/guide/user/{path}"
